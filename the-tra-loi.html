<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thẻ trả lời A B C D</title>
<style>
:root{--ink:#16302A;--muted:#55706A;--line:#BFCBC4;--bg:#F3F6F2}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--bg);padding:16px}
.tool{max-width:760px;margin:0 auto 16px;display:flex;flex-direction:column;gap:10px}
.tool a{color:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,input{font:inherit;min-height:44px;border-radius:10px}
button{border:0;background:#E8B931;color:#2A2206;font-weight:700;padding:10px 16px;cursor:pointer}
input{border:1px solid var(--line);padding:8px 10px;width:90px}
.sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:0;max-width:760px;margin:0 auto;background:#fff}
.card{aspect-ratio:1;border:1px dashed var(--line);position:relative;break-inside:avoid}
.card span{position:absolute;font:800 64px/1 "Baloo 2",system-ui,sans-serif}
.card .A{top:6%;left:50%;transform:translateX(-50%)}
.card .B{right:6%;top:50%;transform:translateY(-50%) rotate(90deg)}
.card .C{bottom:6%;left:50%;transform:translateX(-50%) rotate(180deg)}
.card .D{left:6%;top:50%;transform:translateY(-50%) rotate(-90deg)}
.card .n{top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;color:#8AA197;width:40%;height:40%;border-radius:50%;border:4px solid #16302A;display:grid;place-items:center}
@media print{.tool{display:none}body{background:#fff;padding:0}.sheet{max-width:none}.card{page-break-inside:avoid}}
</style>
</head>
<body>
<div class="tool">
  <a href="hoc-moi-ngay.html#lop-hoc">← Quay lại Đố vui cả lớp</a>
  <h1 style="margin:0;font-size:26px">Thẻ trả lời A B C D</h1>
  <p style="margin:0">In ra giấy A4 (4 thẻ mỗi trang), cắt theo đường chấm. Mỗi em giữ một thẻ có số riêng. Khi trả lời, em xoay thẻ sao cho chữ mình chọn nằm ở cạnh trên rồi giơ lên. Có thể dán lên bìa cứng để dùng cả năm.</p>
  <div class="row"><label for="n">Số thẻ</label><input id="n" type="number" min="1" max="60" value="40"><button id="mk">Tạo thẻ</button><button id="pr">🖨 In</button></div>
</div>
<div class="sheet" id="sheet"></div>
<script>
function make(){
  const n = Math.max(1, Math.min(60, +document.getElementById("n").value || 40));
  let h = "";
  for(let i=1;i<=n;i++) h += `<div class="card"><span class="A">A</span><span class="B">B</span><span class="C">C</span><span class="D">D</span><span class="n">${i}</span></div>`;
  document.getElementById("sheet").innerHTML = h;
}
document.getElementById("mk").onclick = make;
document.getElementById("pr").onclick = ()=>window.print();
make();
</script>
</body>
</html>
