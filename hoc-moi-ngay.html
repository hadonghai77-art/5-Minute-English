  showHelp("noi1");
};
function n1Toggle(){
  if(n1.rec){ n1.stop = true; try{ n1.rec.stop(); }catch(e){} return; }
  if(!SR){ $("n1tr").textContent = srError("nosr"); return; }
  stopSpeak();
  Object.assign(n1, {finals: [], interim: "", t0: 0, first: 0, last: 0, prev: 0, pauses: 0, stop: false, left: 60, startAt: Date.now()});
  $("n1go").innerHTML = '<span class="rec-dot"></span> Đang nghe… bấm để dừng sớm'; $("n1res").innerHTML = "";
  const tick = ()=>{
    if(!n1 || n1.stop) return;
    n1.left = Math.max(0, 60 - Math.floor((Date.now() - n1.startAt)/1000));
    const c = $("n1clock"); if(!c){ n1.stop = true; return; }
    c.textContent = `0:${String(n1.left).padStart(2,"0")}`;
    if(n1.left <= 0){ n1.stop = true; try{ n1.rec && n1.rec.stop(); }catch(e){} return; }
    n1.timer = setTimeout(tick, 250);
  };
  tick();
  n1Listen();
}
/* Máy nghe từng đoạn; hết một đoạn thì nghe tiếp cho tới khi hết 1 phút */
function n1Listen(){
  const me = n1, r = new SR(); me.rec = r;
  r.lang = "en-US"; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  r.onresult = e=>{
    const now = performance.now();
    if(!me.first) me.first = now;
    if(me.prev && now - me.prev > 2000) me.pauses++;
    me.prev = now; me.last = now;
    let fin = "", tmp = "";
    for(let i=0;i<e.results.length;i++){ const t = e.results[i][0].transcript; if(e.results[i].isFinal) fin += t + " "; else tmp += t + " "; }
    me.interim = tmp.trim();
    if(fin.trim()){ me.finals.push(fin.trim()); me.interim = ""; }
    const el = $("n1tr"); if(el) el.textContent = (me.finals.join(" ") + " " + me.interim).trim();
  };
  r.onerror = e=>{ me.err = e.error; if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error)) me.stop = true; };
  r.onend = ()=>{
    if(me.interim){ me.finals.push(me.interim); me.interim = ""; }
    if(n1 !== me) return;
    if(!me.stop && me.left > 0){ try{ n1Listen(); return; }catch(e){} }
    me.rec = null; clearTimeout(me.timer);
    const btn = $("n1go"); if(btn) btn.innerHTML = "🎤 Nói lại 1 phút";
    if(!me.finals.length){ const el = $("n1tr"); if(el) el.textContent = me.err ? srError(me.err) : "Tân chưa nghe thấy gì. Em nói to và rõ hơn nhé."; return; }
    const sec = me.first && me.last ? Math.max(1, (me.last - me.first)/1000 + 0.5) : 0;
    n1Analyse(me.finals, sec, me.pauses, false);
  };
  try{ r.start(); }catch(e){ me.rec = null; }
}
function n1Analyse(parts, sec, pauses, typed){
  const text = parts.join(" ").replace(/\s+/g," ").trim();
  const words = text.split(" ").filter(Boolean), lw = words.map(w=>w.toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z']/g,"")).filter(Boolean);
  const nW = lw.length, uniq = new Set(lw).size;
  const wpm = !typed && sec ? Math.round(nW / sec * 60) : 0;
  const mark = new Array(words.length).fill("");
  const lwAll = words.map(w=>w.toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z']/g,""));
  const findPhrase = (p, cls, plural)=>{ const t = p.toLowerCase().split(/\s+/); let hits = 0;
    for(let i=0;i+t.length<=lwAll.length;i++){ if(t.every((w,k)=>lwAll[i+k] === w || (plural && k === t.length-1 && (lwAll[i+k] === w+"s" || lwAll[i+k] === w+"es")))){ hits++; for(let k=0;k<t.length;k++) if(!mark[i+k]) mark[i+k] = cls; } }
    return hits; };
  const topicUsed = n1.U.words.map(w=>w[0]).filter(w=>findPhrase(w, "tp", true) > 0);
  const linkUsed = LINKERS.slice().sort((a,b)=>b.length-a.length).filter(l=>findPhrase(l, "lk", false) > 0);
  const short = +n1.g < 10;
  const lvOf = (v, good, ok)=> v >= good ? "ok" : v >= ok ? "near" : "bad";
  const M = [
    ["Số từ", `${nW} từ`, lvOf(nW, short ? 35 : 70, short ? 18 : 35), `Cố gắng nói ${short ? "khoảng 35" : "70"} từ trở lên trong 1 phút. Trả lời lần lượt 3 câu hỏi gợi ý, mỗi câu 2 đến 3 câu.`],
    ["Từ khác nhau", `${uniq} từ`, lvOf(uniq, short ? 25 : 40, short ? 12 : 22), "Em dùng thêm nhiều từ khác nhau, đừng lặp lại một câu nhiều lần."],
    ["Từ nối", linkUsed.length ? linkUsed.join(", ") : "chưa có", lvOf(linkUsed.length, 4, 2), "Em nối các ý bằng first, then, because, so, but, for example, finally."],
    ["Từ chủ đề", topicUsed.length ? topicUsed.join(", ") : "chưa có", lvOf(topicUsed.length, 4, 2), `Em dùng thêm từ của bài như: ${n1.U.words.slice(0,4).map(w=>w[0]).join(", ")}.`]
  ];
  if(!typed && wpm){ const p = paceInfo({words: nW, wpm, pauses: 0}); if(p) M.push(["Tốc độ", `${wpm} từ/phút · ${p.label}`, p.level, p.tip]);
    M.push(["Ngắt dài (trên 2 giây)", `${pauses} lần`, pauses <= 2 ? "ok" : pauses <= 4 ? "near" : "bad", "Khi chưa nghĩ ra, em nói “Well,…” hoặc “Let me think…” thay vì im lặng lâu."]); }
  const score = M.reduce((s,m)=>s + (m[2] === "ok" ? 2 : m[2] === "near" ? 1 : 0), 0) / (M.length*2);
  const all = score >= 0.75 ? ["ok","🟢 Tốt"] : score >= 0.45 ? ["near","🟡 Khá, gần đạt"] : ["bad","🟠 Cần luyện thêm"];
  const worst = M.find(m=>m[2] === "bad") || M.find(m=>m[2] === "near");
  tone3(all[0]);
  S.talk1 = (S.talk1||[]).concat([{d: TODAY, g: n1.g, u: n1.u, words: nW, uniq, wpm, link: linkUsed.length}]).slice(-20);
  logOf(TODAY).s += Math.min(5, parts.length);
  if(!typed && wpm){ const pl = S.paceLog[TODAY] || [0,0]; pl[0] += wpm; pl[1]++; S.paceLog[TODAY] = pl; }
  save();
  addFix(`Nói 1 phút · Lớp ${n1.g} Unit ${n1.u}`, worst ? `${worst[0]}: ${worst[3]}` : "", worst ? "" : "");
  if(!worst){ S.fixes[S.fixes.length-1].ok = true; save(); }
  markDone("noi1", n1.g + "-" + n1.u);
  $("n1tr").innerHTML = words.map((w,i)=>mark[i] ? `<span class="${mark[i]}">${esc(w)}</span>` : esc(w)).join(" ");
  $("n1res").innerHTML = `<section class="card" style="display:flex;flex-direction:column;gap:10px"><div class="top"><h3>Kết quả</h3><span class="lv ${all[0]}">${all[1]}</span></div>
    <div class="metrics">${M.map(m=>`<div class="metric"><b>${esc(m[0])}</b><span class="lv ${m[2]}">${m[2] === "ok" ? "🟢" : m[2] === "near" ? "🟡" : "🟠"} ${esc(m[1])}</span>${m[2] !== "ok" ? `<span class="small muted">${esc(m[3])}</span>` : ""}</div>`).join("")}</div>
    <p class="small muted">Trong lời em nói: <span class="lk" style="font-weight:700;text-decoration:underline">từ nối</span> được gạch chân, <span style="background:var(--ok-soft);color:var(--ok);border-radius:4px;padding:0 2px">từ chủ đề</span> được tô xanh. Tân chấm bằng quy tắc (đếm từ, tốc độ, từ nối), chưa chấm được ngữ pháp sâu.</p>
    <div class="onebox"><b>🎯 Một điều cần sửa nhất</b><span>${worst ? esc(worst[0] + ": " + worst[3]) : "Em nói rất tốt! Lần sau em thử nói thêm ví dụ của bản thân."}</span></div>
    <div class="row" style="justify-content:center"><button class="btn green" id="n1ag">Nói lại</button><a class="btn ghost" href="noi-tu-do.html?lop=${esc(n1.g)}&u=${esc(n1.u)}">🗣️ Nói tự do với Tân</a></div></section>`;
  $("n1ag").onclick = ()=>{ window.scrollTo(0,0); n1Toggle(); };
  $("n1res").scrollIntoView({block:"start", behavior:"smooth"});
  tanSay(worst ? "Một điều cần sửa nhất: " + worst[3] : "Em nói rất tốt!", worst ? "" : "Great job!", !worst);
  celebrate(checkBadges());
}

/* ================= Thẻ khoe thành tích ================= */
async function makeCard(){
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  try{ await Promise.race([Promise.all([document.fonts.load('800 80px "Baloo 2"'), document.fonts.load('600 40px "Be Vietnam Pro"'), document.fonts.load('400 40px "Be Vietnam Pro"')]), new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  const D = s=>`800 ${s}px "Baloo 2","Be Vietnam Pro",system-ui,sans-serif`, B = (w,s)=>`${w} ${s}px "Be Vietnam Pro",system-ui,sans-serif`;
  const gr = x.createLinearGradient(0,0,0,H); gr.addColorStop(0,"#1F5C45"); gr.addColorStop(1,"#123829");
  x.fillStyle = gr; x.fillRect(0,0,W,H);
  x.strokeStyle = "#E8B931"; x.lineWidth = 12; x.strokeRect(30,30,W-60,H-60);
  x.fillStyle = "#E8B931"; x.font = D(64); x.textBaseline = "alphabetic"; x.fillText("Tiếng Anh 5 phút", 80, 150);
  x.fillStyle = "#CFE3D8"; x.font = B(500, 30); x.fillText("Trường PTDTNT THCS và THPT Vĩnh Thạnh", 80, 200);
  try{
    const img = new Image(); const svg = tanSVG(true);
    await new Promise((res, rej)=>{ img.onload = res; img.onerror = rej; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); setTimeout(rej, 1500); });
    x.drawImage(img, W - 330, 230, 260, 292);
  }catch(e){}
  const name = (S.name || "Học sinh").slice(0,24);
  x.fillStyle = "#FFFFFF"; x.font = D(name.length > 14 ? 70 : 88); x.fillText(name, 80, 330);
  x.fillStyle = "#CFE3D8"; x.font = B(500, 36); x.fillText((S.cls ? "Lớp " + S.cls + " · " : "") + "ngày " + dmy(TODAY) + "/" + new Date().getFullYear(), 80, 385);
  const st = shownStreak();
  x.font = "120px system-ui, sans-serif"; x.fillText("🔥", 70, 560);
  x.fillStyle = "#E8B931"; x.font = D(170); x.fillText(String(st), 230, 580);
  x.fillStyle = "#FFFFFF"; x.font = B(600, 40); x.fillText("ngày học liên tiếp", 80, 640);
  const mon = mondayOf(TODAY); let r=0,s=0,q=0,days=0;
  for(let d=mon; d<mon+7; d++){ const L = S.log[d]; if(!L) continue; r+=L.r; s+=L.s; q+=L.q; if(L.t.every(Boolean)) days++; }
  const stats = [[String(mastered()),"từ nhớ chắc"],[String(sumLog("s")),"câu đọc to"],[String(sumLog("q")),"câu trả lời đúng"],[`${Object.keys(S.badges).length}/${BADGES.length}`,"huy hiệu"]];
  stats.forEach((v,i)=>{ const cx = 80 + (i%2)*470, cy = 700 + Math.floor(i/2)*200;
    x.fillStyle = "rgba(255,255,255,.10)"; x.beginPath(); if(x.roundRect) x.roundRect(cx, cy, 440, 170, 28); else x.rect(cx, cy, 440, 170); x.fill();
    x.fillStyle = "#E8B931"; x.font = D(84); x.fillText(v[0], cx + 30, cy + 100);
    x.fillStyle = "#FFFFFF"; x.font = B(500, 34); x.fillText(v[1], cx + 30, cy + 148); });
  const got = BADGES.filter(b=>S.badges[b[0]]).map(b=>b[1]).slice(0,9);
  x.font = "64px system-ui, sans-serif"; x.fillText(got.join(" ") || "🌱", 80, 1180);
  x.fillStyle = "#CFE3D8"; x.font = B(500, 30); x.fillText(`Tuần này: ${days}/7 ngày xong việc · ${days*10 + r + s*2 + q*2} điểm thi đua`, 80, 1250);
  return c;
}
async function shareCard(){
  showPop(`<div class="pw">📸 Thẻ thành tích</div><p class="small muted">Đang vẽ thẻ…</p>`);
  let c; try{ c = await makeCard(); }catch(e){ showPop(`<p>Máy chưa vẽ được thẻ.</p><button class="btn" onclick="hidePop()">Đóng</button>`); return; }
  const url = c.toDataURL("image/png");
  showPop(`<div class="pw">📸 Thẻ thành tích</div><img class="cardimg" src="${url}" alt="Thẻ thành tích của em">
    <div class="row"><button class="btn green" id="cshare">📤 Gửi vào nhóm lớp</button><a class="btn ghost" id="csave" download="the-thanh-tich.png" href="${url}">⬇ Lưu ảnh</a><button class="btn ghost" id="ctg">✈️ Telegram</button><button class="btn ghost" onclick="hidePop()">Đóng</button></div><p class="small" id="cmsg"></p>`);
  $("ctg").onclick = ()=>{
    const txt = `🏅 ${S.name || "Em"}${S.cls ? " (lớp " + S.cls + ")" : ""} học Tiếng Anh 5 phút ${shownStreak()} ngày liền, nhớ chắc ${mastered()} từ, đọc to ${sumLog("s")} câu, có ${Object.keys(S.badges).length} huy hiệu!`;
    openTg(APP_HOME(), txt, $("cmsg"));
    $("cmsg").textContent += " Muốn gửi kèm ảnh: bấm “Lưu ảnh” rồi gửi ảnh vào nhóm Telegram.";
  };
  $("cshare").onclick = ()=>c.toBlob(async blob=>{
    const f = new File([blob], "the-thanh-tich.png", {type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      try{ await navigator.share({files:[f], title:"Thành tích Tiếng Anh 5 phút", text:"Em đã học " + shownStreak() + " ngày liền!"}); $("cmsg").textContent = "Đã mở phần gửi. Em chọn nhóm lớp trên Zalo hoặc Telegram."; }catch(e){}
    }else{ $("cmsg").textContent = "Máy này chưa gửi ảnh trực tiếp được. Em bấm “Lưu ảnh” rồi gửi ảnh qua Zalo hoặc Telegram."; }
  }, "image/png");
}
window.addEventListener("pageshow", e=>{ if(e.persisted){ S = load(); route(); } });

function route(){
  stopSpeak(); hidePop(); clearInterval(ctimer); if(window.TraTu) TraTu.close();
  if(reading){ try{ reading.stop(); }catch(e){} reading = null; }
  if(ls) ls.playing = false; if(sto) sto.auto = false;
  if(n1){ n1.stop = true; clearTimeout(n1.timer); if(n1.rec){ try{ n1.rec.abort(); }catch(e){} } n1 = null; }
  const h = (location.hash || "#hom-nay").slice(1), [name, arg] = h.split("/");
  const v = VIEWS[name] || VIEWS["hom-nay"];
  if(name !== "lop-hoc") document.body.classList.remove("class-on");
  const tabName = ({"noi-truyen":"truyen","kiem-tra":"hom-nay","do-nhanh":"hom-nay","chu-cai":"them","nghe":"them","lop-hoc":"them","thi-dua":"them","huy-hieu":"them","gop-y":"them","noi-cap":"them","khac-loai":"them","dien-noi":"them","noi-1-phut":"them","thay-co":"them","nhap-ma":"them","bai-tap":"hom-nay","bai-tap-xem":"hom-nay","bo-tu":"so-tu"})[name] || name;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current", t.getAttribute("href")==="#"+tabName ? "page" : "false"));
  v(arg);
  window.scrollTo(0,0);
}
addEventListener("hashchange", route);
route();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
