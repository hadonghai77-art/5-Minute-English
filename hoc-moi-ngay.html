<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5C45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Học mỗi ngày · Tiếng Anh 5 phút</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: một cột như điện thoại, thanh chuyển mục ở đáy; chế độ lớp học dùng toàn màn hình để chiếu */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --ink:#16302A; --muted:#55706A; --line:#D6E0DA;
  --board:#1F5C45; --board-ink:#F4F8F2; --chalk:#E8B931; --chalk-ink:#2A2206; --soft:#E7F0EA;
  --ok:#1E8A55; --ok-soft:#DDF2E6; --bad:#C2551F; --bad-soft:#FBE6DA;
  --a:#D9483B; --b:#2F74C0; --c:#E3A21A; --d:#2E9A5B;
  --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  color-scheme:dark;
  --bg:#0E1D18; --surface:#16291F; --ink:#E6EFE9; --muted:#9DB5AB; --line:#2A4238;
  --board:#1B4A38; --board-ink:#EEF5EF; --chalk:#F0C849; --chalk-ink:#241C02; --soft:#1C3329;
  --ok:#5CC98F; --ok-soft:#173A28; --bad:#F09466; --bad-soft:#3E2418;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:12px 24px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800}
h2{font-size:24px;font-weight:800}
h3{font-size:18px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.home-link{font-weight:600;font-size:14px;text-decoration:none;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px;max-width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{border:0;background:var(--chalk);color:var(--chalk-ink);font-weight:700;padding:11px 16px;border-radius:12px;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.green{background:var(--board);color:var(--board-ink)}
.btn.big{font-size:18px;min-height:56px;padding:12px 20px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.w:focus-visible,.opt:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* Tân và bong bóng lời */
.tan{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:end}
.tan svg{width:86px;height:96px;display:block}
.bubble{background:var(--surface);border:2px solid var(--board);border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:15.5px;min-width:0}
.bubble .en{display:block;font-weight:700;margin-top:4px}
.blink{animation:blink 4.2s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.m-open{display:none}.talking .m-open{display:inline}.talking .m-smile{display:none}
.tanhead{transform-box:fill-box;transform-origin:50% 90%}
.talking .tanhead{animation:talk .8s ease-in-out infinite}
@keyframes talk{30%{transform:rotate(3deg)}70%{transform:rotate(-2deg)}}
.cheer .tanhead{animation:hop .5s ease 2}
@keyframes hop{50%{transform:translateY(-6px)}}

/* Hôm nay */
.hero{background:var(--board);color:var(--board-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero .bubble{color:var(--ink)}
.streak{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.streak .lbl{white-space:nowrap}
.flame{font-size:40px;line-height:1}
.streak b{font:800 34px/1 var(--display);color:var(--chalk)}
.week7{display:flex;gap:6px;margin-left:auto}
.week7 span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.12);color:var(--board-ink)}
.week7 span.on{background:var(--chalk);color:var(--chalk-ink)}
.week7 span.today{outline:2px solid var(--chalk);outline-offset:1px}
.tasks{display:flex;flex-direction:column;gap:10px}
.task{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:inherit;min-height:68px}
.task .ic{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:22px}
.task.done .ic{background:var(--ok-soft)}
.task .t{font-weight:700;display:block}
.task .d{font-size:13.5px;color:var(--muted)}
.task .st{font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.task.done .st{color:var(--ok)}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:4px;align-items:center;min-height:92px;justify-content:center}
.tool span:first-child{font-size:28px;line-height:1}
.tool span:last-child{font-size:13.5px;font-weight:600}
.badges{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.bdg{flex:none;width:72px;text-align:center;font-size:11.5px;line-height:1.25;color:var(--muted)}
.bdg i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 4px;border-radius:50%;background:var(--soft);font-size:26px;font-style:normal;filter:grayscale(1);opacity:.45}
.bdg.on{color:var(--ink)}.bdg.on i{filter:none;opacity:1;background:var(--chalk-soft,#FFF3CC);box-shadow:0 0 0 2px var(--chalk)}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}

/* Thẻ từ */
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px 16px}
.flash .wd{font:800 40px/1.1 var(--display);word-break:break-word}
.flash .ipa{color:var(--muted)}
.flash .stress{font-size:18px;letter-spacing:.5px;min-height:1px}
.pa-st{color:var(--bad,#C2452D);font-weight:800}.pa-dot{font-style:normal;opacity:.45;margin:0 1px}
.pa-tip{background:var(--sun-soft,#FFF1C9);border-radius:10px;padding:9px 11px;font-size:14.5px;line-height:1.45}
.pa-tip .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}.pa-tip .hd b{font-size:17px}
.pa-tip .hd .btn{padding:5px 10px;font-size:13px;margin-left:auto}
.onebox{background:var(--sun-soft,#FFF1C9);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.chart svg{width:100%;height:auto;display:block}
.fixlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.fixlist li{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px}
.ptbar{display:grid;grid-template-columns:52px 1fr 40px;gap:8px;align-items:center;font-size:14px}
.ptbar i{display:block;height:12px;border-radius:6px;background:var(--board)}
.ptbar span:nth-child(2){background:var(--line);border-radius:6px;overflow:hidden}
.flash .vi{font-size:22px;font-weight:700;color:var(--board)}
@media (prefers-color-scheme: dark){.flash .vi{color:var(--chalk)}}
.flash .ex{font-size:15.5px}
.flash .exvi{font-size:14px;color:var(--muted)}
.counter{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:14px}

/* Đọc to */
.sent{font:600 24px/1.5 var(--body);display:flex;flex-wrap:wrap;gap:4px 8px}
.w{cursor:pointer;border-radius:6px;padding:0 3px;border:0;background:none;font:inherit;color:inherit}
.w.ok{background:var(--ok-soft);color:var(--ok)}
.w.miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.w.now{background:var(--chalk);color:var(--chalk-ink)}
.score{font:800 28px/1 var(--display)}
.rec-dot{width:12px;height:12px;border-radius:50%;background:#D9483B;display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.note{font-size:13.5px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px}

/* Câu hỏi */
.q{font:600 21px/1.4 var(--body)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;min-height:54px;font-size:17px}
.opt b{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:15px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{font-size:15px;border-left:4px solid var(--chalk);padding:8px 12px;background:var(--soft);border-radius:0 10px 10px 0}

/* Truyện */
.storylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:150px}
.story .cv{font-size:40px;line-height:1}
.story b{font-family:var(--display);font-size:17px;line-height:1.2}
.story.read{border-color:var(--ok)}
.panel{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.scene{font-size:72px;line-height:1.1;background:linear-gradient(var(--soft),var(--surface));border-radius:18px;width:100%;padding:28px 10px;letter-spacing:8px}
.panel .sent{justify-content:center}
.panel .vi{color:var(--muted);font-size:16px}
.pop{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,420px);background:var(--surface);border:2px solid var(--board);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:30;display:flex;flex-direction:column;gap:8px}
.pop .pw{font:800 26px/1.1 var(--display)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--board)}

/* Chữ cái */
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.abc button{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:800 28px/1 var(--display);cursor:pointer;position:relative}
.abc button.seen::after{content:"✓";position:absolute;top:3px;right:6px;font-size:12px;color:var(--ok)}
.letter{font:800 96px/1 var(--display);color:var(--board);text-align:center}
@media (prefers-color-scheme: dark){.letter{color:var(--chalk)}}
.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pic{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.pic span:first-child{font-size:44px;line-height:1.1}
.pic b{font-size:16px}
.pic small{color:var(--muted);font-size:12.5px}
.pic.right{border:2px solid var(--ok);background:var(--ok-soft)}
.pic.wrong{border:2px solid var(--bad);background:var(--bad-soft)}

/* Bài nghe */
.transcript{font-size:16.5px;line-height:1.7}
.transcript span{cursor:pointer;border-radius:4px}
.transcript span.now{background:var(--chalk);color:var(--chalk-ink)}

/* Thi đua */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n{text-align:right;font-weight:700}
.report{background:var(--board);color:var(--board-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.report .big{font:800 44px/1 var(--display);color:var(--chalk)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stats div{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px}
.stats b{display:block;font:800 24px/1.1 var(--display)}

/* Góp ý */
.faces{display:flex;gap:6px;justify-content:space-between}
.faces button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);min-height:72px}
.faces button span{font-size:30px;line-height:1.1}
.faces button[aria-pressed="true"]{border-color:var(--board);background:var(--soft);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;cursor:pointer;font-size:14.5px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--board);color:var(--board-ink);border-color:var(--board)}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:96px;resize:vertical}
.fbitem{border-top:1px solid var(--line);padding-top:10px;font-size:14.5px}
.fbitem:first-of-type{border-top:0;padding-top:0}

/* Thanh chuyển mục */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:4px max(4px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px;min-height:56px;justify-content:center}
.tab span:first-child{font-size:22px;line-height:1}
.tab[aria-current="page"]{color:var(--board);background:var(--soft)}
@media (prefers-color-scheme: dark){.tab[aria-current="page"]{color:var(--chalk)}}

/* Chế độ lớp học: chữ to để chiếu lên tivi */
body.class-on{padding-bottom:16px}
body.class-on .wrap{max-width:none}
body.class-on nav.tabs{display:none}
.cls{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.cls .q{font-size:clamp(24px,4.4vw,48px);line-height:1.25;text-align:center}
.cls .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
.cls .opt{font-size:clamp(18px,3vw,34px);min-height:clamp(64px,12vh,120px);color:#fff;border:0}
.cls .opt b{background:rgba(0,0,0,.18);width:clamp(36px,5vw,60px);height:clamp(36px,5vw,60px);font-size:clamp(18px,3vw,32px)}
.cls .opt.dim{opacity:.25}
.cls .opt.right{outline:6px solid var(--ink);opacity:1}
.timer{height:16px;border-radius:99px;background:var(--soft);overflow:hidden}
.timer i{display:block;height:100%;background:var(--chalk);transition:width 1s linear}
.teams{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.team{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;min-width:120px;text-align:center;cursor:pointer}
.team b{display:block;font:800 30px/1 var(--display)}
.team.hit{border-color:var(--ok);background:var(--ok-soft)}
@media (max-width:520px){.cls .opts{grid-template-columns:1fr}.tools{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="pop" id="pop" hidden></div>

<nav class="tabs" aria-label="Chuyển mục">

  <a class="tab" href="#doc-to"><span>🎤</span><span>Đọc to</span></a>
  <a class="tab" href="#truyen"><span>📖</span><span>Truyện</span></a>
  <a class="tab" href="#them"><span>☰</span><span>Thêm</span></a>
</nav>

<script src="du-lieu-bai.js"></script>
<script src="noi-dung-them.js"></script>
<script src="phat-am.js"></script>
<script src="tra-tu.js"></script>
<script>
"use strict";
/* ================= Lưu trữ trên máy (không cần tài khoản) ================= */
const KEY = "hmn-v1";
let S = load();
function load(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  s = s || {};
  const def = {grade:null,name:"",cls:"",srs:{},custom:{},log:{},streak:{last:-9,count:0,best:0,freeze:-1},badges:{},stories:{},letters:{},listen:{},extra:{},teams:null,newDay:-1,newCount:0,feedback:[],askDay:-99,reads:{},fixes:[],placed:null,talkStory:{}};
  for(const k in def) if(s[k]===undefined) s[k]=def[k];
  if(!s.grade){ let g="6"; try{ g = localStorage.getItem("grade") || "6"; }catch(e){} s.grade = g; }
  return s;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ================= Ngày, tuần học ================= */
const DAY = 86400000;
function dayNum(d){ d = d || new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset()*60000)/DAY); }
const TODAY = dayNum();
const SCHOOL_START = dayNum(new Date(2026, 8, 7)); // Thứ Hai 7/9/2026 là tuần 1
function schoolWeek(){ return Math.max(1, Math.min(35, Math.floor((TODAY - SCHOOL_START)/7) + 1)); }
function mondayOf(d){ const wd = (d + 3) % 7; return d - wd; } // ngày 0 (1/1/1970) là thứ Năm
const VN_DAYS = ["T2","T3","T4","T5","T6","T7","CN"];
function logOf(d){ return S.log[d] || (S.log[d] = {r:0,s:0,q:0,t:[0,0,0]}); }

/* ================= Dữ liệu bài học ================= */
const gNum = ()=> parseInt(S.grade,10);
const srcGrade = ()=> String(Math.min(12, Math.max(6, gNum())));
function unitStartWeek(u){ return parseInt(String(u.week).split(/[–-]/)[0],10); }
function learnedUnits(){
  // Các bài đã tới tuần học + bài em tự thêm.
  const out = [];
  const g = srcGrade(), wk = schoolWeek();
  for(const u of BAI[g]) if(unitStartWeek(u) <= wk) out.push([g, u.u]);
  for(const k in S.extra){ const [eg, eu] = k.split("-"); if(!out.some(x=>x[0]===eg && x[1]==+eu)) out.push([eg, +eu]); }
  return out;
}
function unitOf(g,u){ return (BAI[g]||[]).find(x=>x.u==u); }
function wordOf(key){
  if(key.startsWith("c|")){ const w = key.slice(2), c = S.custom[w]; return c ? {w, ipa:"", vi:c[0], ex:c[1]||"", exvi:c[2]||"", src:"Từ em lưu"} : null; }
  const [g,u,i] = key.split("-"); const U = unitOf(g,u); if(!U || !U.words[i]) return null;
  const x = U.words[i]; return {w:x[0], ipa:x[1], vi:x[2], ex:x[3], exvi:x[4], src:`Lớp ${g} · Unit ${u}`};
}
function allLearnedKeys(){
  const keys = [];

const GAP = [0,1,3,7,14,30,60]; // số ngày chờ trước lần ôn tiếp theo, theo từng hộp
const NEW_PER_DAY = 6, MAX_DUE = 20;
function dueKeys(){ return Object.keys(S.srs).filter(k=>S.srs[k][1] <= TODAY && wordOf(k)).sort((a,b)=>S.srs[a][1]-S.srs[b][1]); }
function newKeys(){
  if(S.newDay !== TODAY){ S.newDay = TODAY; S.newCount = 0; }
  const left = Math.max(0, NEW_PER_DAY - S.newCount);
  return allLearnedKeys().filter(k=>!S.srs[k]).slice(0, left);
}
function grade(key, remembered){
  const cur = S.srs[key] || [0, TODAY];
  if(!S.srs[key]) S.newCount++;
  const box = remembered ? Math.min(GAP.length-1, cur[0]+1) : 1;
  S.srs[key] = [box, TODAY + (remembered ? GAP[box] : 0)];
  logOf(TODAY).r++;
  save();
}

const synth = window.speechSynthesis;
let enVoice = null, viVoice = null;
function pickVoices(){
  if(!synth) return;
  const all = synth.getVoices();
  const en = all.filter(v=>/^en[-_]/i.test(v.lang));
  enVoice = en.find(v=>/en[-_](GB|US)/i.test(v.lang) && /google|samantha|daniel|libby|sonia|zira/i.test(v.name)) || en[0] || null;
  viVoice = all.find(v=>/^vi/i.test(v.lang)) || null;
}
if(synth){ pickVoices(); synth.onvoiceschanged = pickVoices; }
function say(text, opt){
  opt = opt || {};
  return new Promise(res=>{
    if(!synth){ setTimeout(res, 400); return; }
    const vi = opt.lang === "vi";
    if(vi && !viVoice){ setTimeout(res, 300); return; }
    try{
      if(!opt.queue) synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if(vi){ u.voice = viVoice; u.lang = viVoice.lang; }
      else { if(enVoice) u.voice = enVoice; u.lang = enVoice ? enVoice.lang : "en-GB"; }
      u.rate = opt.rate || (vi ? 1 : 0.85);
      u.pitch = opt.pitch || 1.05;
      if(opt.onWord) u.onboundary = e=>{ if(e.name !== "sentence") opt.onWord(e.charIndex); };
      let done = false; const fin = ()=>{ if(!done){ done = true; res(); } };
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 1500 + text.length * 110);
      synth.speak(u);
    }catch(e){ res(); }
  });
}
function stopSpeak(){ if(synth) synth.cancel(); }

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const NUMW = {one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",nine:"9",ten:"10"};
const SAMEW = {favorite:"favourite",color:"colour",neighbor:"neighbour",neighborhood:"neighbourhood",center:"centre",theater:"theatre",traveling:"travelling",realize:"realise",organize:"organise",math:"maths",ok:"okay"};
function normToks(s){
  return s.toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z0-9'\s-]/g," ").replace(/-/g," ")
    .split(/\s+/).filter(Boolean).map(w=>{ w = w.replace(/'s$/,"").replace(/'/g,""); return NUMW[w]||SAMEW[w]||w; });
}
/* Trả về mảng đúng/sai cho từng từ của câu mẫu (dựa trên dãy con chung dài nhất). */
function matchWords(model, said){
  const mw = model.split(/\s+/), m = mw.map(w=>normToks(w).join("")), s = normToks(said);
  const n = m.length, k = s.length;
  const L = Array.from({length:n+1},()=>new Array(k+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=k-1;j>=0;j--) L[i][j] = (m[i] && m[i]===s[j]) ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const ok = new Array(n).fill(false);
  let i=0, j=0;
  while(i<n && j<k){ if(m[i] && m[i]===s[j]){ ok[i]=true; i++; j++; } else if(L[i+1][j] >= L[i][j+1]) i++; else j++; }
  m.forEach((x,idx)=>{ if(!x) ok[idx]=true; }); // dấu câu đứng riêng
  return ok;
}
function listen(onText, onEnd){
  if(!SR){ onEnd("nosr"); return null; }
  const r = new SR();
  r.lang = "en-US"; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
  let best = "", err = null;
  r.onresult = e=>{ let t = ""; for(let i=0;i<e.results.length;i++) t += e.results[i][0].transcript + " "; best = t.trim(); onText(best, false); };
  r.onerror = e=>{ err = e.error; };
  r.onend = ()=>{ onEnd(err, best); };
  try{ r.start(); }catch(e){ onEnd("start"); return null; }
  return r;
}

let recState = null;
async function toggleRecord(btn, audioEl, onDone){
  if(recState){ recState.rec.stop(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const rec = new MediaRecorder(stream), chunks = [];
    rec.ondataavailable = e=>chunks.push(e.data);
    rec.onstop = ()=>{
      stream.getTracks().forEach(t=>t.stop());
      const url = URL.createObjectURL(new Blob(chunks, {type: rec.mimeType || "audio/webm"}));
      audioEl.src = url; audioEl.hidden = false; audioEl.play().catch(()=>{});
      btn.innerHTML = "⏺ Ghi âm lại"; recState = null; onDone && onDone();
    };
    rec.start(); recState = {rec};
    btn.innerHTML = '<span class="rec-dot"></span> Dừng ghi âm';
  }catch(e){
    btn.disabled = true; btn.textContent = "Máy chưa cho ghi âm";
  }
}

const CORE = ["index.html","hoc-moi-ngay.html","du-lieu-bai.js","noi-dung-them.js","tra-tu.js","tu-dien.js","cau-vi.js","phat-am.js","phat-am-du-lieu.js","dt-them.js","nhap-vai-gia-lai.html","the-tra-loi.html","manifest.webmanifest","icon-192.png","icon-512.png"];
function weekFiles(curU){
  const f = CORE.slice();
  if(curU) curU.links.forEach(l=>f.push(l[0]));
  return f;
}
function allFiles(){
  const f = CORE.slice();
  for(const g in BAI) for(const u of BAI[g]) u.links.forEach(l=>f.push(l[0]));
  for(const g in BAI) for(let k=1;k<=4;k++) f.push(`lop-${g}-on-tap-${k}.html`);
  return [...new Set(f)];
}
async function countCached(files){
  if(!("caches" in window)) return -1;
  let n = 0; for(const f of files){ try{ if(await caches.match(f, {ignoreSearch:true})) n++; }catch(e){} }
  return n;
}
async function offlineCard(curU){
  const st = $("offst"), bar = $("offbar"); if(!st) return;
  const wf = weekFiles(curU), af = allFiles();
  const show = async()=>{
    const w = await countCached(wf), a = await countCached(af);
    if(w < 0){ st.textContent = "Trình duyệt này chưa lưu được bài. Hãy mở bằng Chrome và cài app lên màn hình chính."; $("dlweek").disabled = $("dlall").disabled = true; return; }
    bar.style.width = Math.round(100*a/af.length) + "%";
    st.textContent = (w === wf.length ? "✓ Bài tuần này đã có trong máy. " : `Bài tuần này: ${w}/${wf.length} phần đã lưu. `) + `Cả năm: ${a}/${af.length} trang đã lưu.`;
  };
  const dl = async(files, btn)=>{
    btn.disabled = true; const old = btn.textContent; btn.textContent = "Đang tải…";
    try{
      const c = await caches.open("tai-ve-1"); let ok = 0;
      for(const f of files){ try{ const r = await fetch(f, {cache:"reload"}); if(r.ok){ await c.put(f, r); ok++; } }catch(e){} }
      btn.textContent = ok === files.length ? "✓ Đã tải xong" : `Tải được ${ok}/${files.length}. Có mạng hãy thử lại.`;
    }catch(e){ btn.textContent = "Chưa tải được. Hãy thử lại khi có mạng."; }
    setTimeout(()=>{ btn.textContent = old; btn.disabled = false; }, 3500);
    show();
  };
  $("dlweek").onclick = ()=>dl(wf, $("dlweek"));
  $("dlall").onclick = ()=>dl(af, $("dlall"));
  show();
}

  if(reading){ try{ reading.stop(); }catch(e){} return; }

    $("rscore").textContent = pct + "%";
    const miss = en.split(/\s+/).filter((_,k)=>!ok[k]).map(w=>w.replace(/[^\w'-]/g,"")).filter(Boolean);

function makeQuestions(n, units){
  const pool = [];
  for(const [g,u] of units){ const U = unitOf(g,u); if(!U) continue;
    U.practice.forEach(p=>pool.push({q:p[0], o:p[2], a:p[1], why:p[3], src:`Unit ${u}`}));
    U.words.forEach((w,i)=>{ const others = shuffle(U.words.filter((_,j)=>j!==i)).slice(0,3).map(x=>x[0]);
      pool.push({q:`"${w[2]}" trong tiếng Anh là gì?`, o:[w[0], ...others], a:w[0], why:`${w[0]} ${w[1]}: ${w[2]}. Ví dụ: ${w[3]}`, src:`Unit ${u}`}); });
  }
  return shuffle(pool).slice(0, n).map(q=>({...q, o: shuffle(q.o)}));
}

function glossFor(t, word){
  const w = word.toLowerCase().replace(/[^a-z'-]/g,"");
  if(t.gl[w]) return [w, t.gl[w]];
  for(const k in t.gl) if(k.includes(" ") && k.split(" ").includes(w)) return [k, t.gl[k]];
  // tìm trong từ vựng các bài
  for(const g in BAI) for(const U of BAI[g]) for(const x of U.words) if(x[0].toLowerCase() === w) return [x[0], x[2]];
  return [w, null];
}
function drawPanel(autoRead){

  $("pan").innerHTML = `<div class="scene" aria-hidden="true">${p[0]}</div>

    ${sto.vi ? `<p class="vi">${esc(p[2])}</p>` : ""}
    <div class="row"><button class="btn ghost" id="pread">🔊 Nghe câu này</button><a class="btn ghost" href="#doc-to/s${t.id}">🎤 Đọc to truyện</a></div>
    <div class="dots">${t.panels.map((_,k)=>`<i class="${k<=sto.i?"on":""}"></i>`).join("")}</div>`;

function readPanel(){

    .then(()=>ws.forEach(w=>w.classList.remove("now")));
}
function wordPop(t, raw){

let cq = null, ctimer = null, actx = null;
function beep(f, ms){
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.15, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + ms/1000);
    o.start(); o.stop(actx.currentTime + ms/1000); }catch(e){}
}

async function sendFb(f, btn, msg){

/* ================= Trò chuyện với Tân về truyện ================= */
let nt = null;
function ntNorm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/[’'`]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim(); }
VIEWS["noi-truyen"] = (arg)=>{
  const t = TRUYEN.find(x=>x.id===arg), Q = (window.TRUYEN_HOI||{})[arg];
  if(!t || !Q){ location.hash = "truyen"; return; }
  nt = {t, Q, i:0, right:0, tries:0, log:[]};
  app.innerHTML = `<div class="top"><a class="home-link" href="#truyen/${t.id}">← Truyện</a><span class="small muted">${esc(t.title)}</span></div>
    <div><h1>Trò chuyện với Tân</h1><p class="muted">Tân hỏi ${Q.length} câu về truyện “${esc(t.vi)}”. Em trả lời bằng tiếng Anh: bấm micro để nói, hoặc gõ chữ.</p></div>
    <div class="card" id="ntbox" style="display:flex;flex-direction:column;gap:12px"></div>`;
  ntDraw();
};
function ntDraw(){
  const box = $("ntbox"); if(!box) return;
  if(nt.i >= nt.Q.length) return ntEnd();
  const q = nt.Q[nt.i]; nt.tries = 0;
  box.innerHTML = `<div class="top"><span class="counter">Câu ${nt.i+1}/${nt.Q.length}</span><span class="small muted">${q[5] ? "Câu hỏi về em" : "Câu hỏi về truyện"}</span></div>
    ${tanBox(q[1], q[0])}
    <div class="row"><button class="btn ghost" id="ntq">🔊 Nghe lại câu hỏi</button><button class="btn ghost" id="nth">💡 Gợi ý</button></div>
    <p class="small" id="nthint" hidden></p>
    <button class="btn big green" id="ntmic">🎤 Bấm rồi trả lời</button>
    <div class="row"><input type="text" id="ntin" placeholder="Hoặc gõ câu trả lời…" style="flex:1;min-width:0" enterkeyhint="send" autocomplete="off"><button class="btn" id="ntsend">Gửi</button></div>
    <p class="small" id="ntheard"></p><div id="ntfb"></div>`;
  $("ntq").onclick = ()=>say(q[0], {rate:0.8});
  $("nth").onclick = ()=>{ const h = $("nthint"); h.hidden = false; h.innerHTML = `Em có thể nói: <b>${esc(q[2])}</b>`; say(q[2], {rate:0.8}); };
  $("ntsend").onclick = ()=>{ const v = $("ntin").value.trim(); if(v){ $("ntin").value = ""; ntJudge(v); } };
  $("ntin").onkeydown = e=>{ if(e.key==="Enter") $("ntsend").click(); };
  $("ntmic").onclick = ()=>{
    if(reading){ try{ reading.stop(); }catch(e){} return; }
    stopSpeak(); const btn = $("ntmic");
    btn.innerHTML = '<span class="rec-dot"></span> Tân đang nghe… (bấm để dừng)';
    reading = listen(tx=>{ $("ntheard").textContent = "Tân nghe được: " + tx; }, (err, tx)=>{
      reading = null; if($("ntmic")) $("ntmic").innerHTML = "🎤 Bấm rồi trả lời";
      if(err && !tx){ $("ntheard").textContent = srError(err) + " Em có thể gõ câu trả lời vào ô bên dưới."; return; }
      if(tx) ntJudge(tx);
    });
    if(!reading) btn.innerHTML = "🎤 Bấm rồi trả lời";
  };
  setTimeout(()=>tanSay("", q[0]), 200);
}
function ntJudge(text){
  const q = nt.Q[nt.i], n = ntNorm(text), ok = new RegExp(q[3]).test(n) && n.split(" ").length >= 2;
  $("ntheard").textContent = "Em trả lời: " + text;
  nt.tries++;
  if(ok){
    if(nt.tries === 1) nt.right++;
    if(nt.tries === 1) nt.log.push({q:q[0], a:text, ok:true, model:q[2]});
    $("ntfb").innerHTML = `<p class="why">✅ ${pick(["Đúng rồi!","Hay lắm!","Chính xác!"])} Câu trả lời đầy đủ: <b>${esc(q[2])}</b></p><button class="btn" id="ntn" style="margin-top:10px">${nt.i < nt.Q.length-1 ? "Câu tiếp ›" : "Xem kết quả ›"}</button>`;
    $("ntn").onclick = ()=>{ nt.i++; ntDraw(); };
    tanSay(pick(["Đúng rồi!","Hay lắm!","Em trả lời tốt lắm!"]), q[2], true);
  }else{
    const short = n.split(" ").length < 2;
    const note = short ? "Em trả lời bằng một câu đủ ý nhé, ít nhất vài từ." : q[4];
    if(nt.tries === 1) nt.log.push({q:q[0], a:text, ok:false, model:q[2], note});
    $("ntfb").innerHTML = `<p class="why" style="background:var(--bad-soft,#FBE3DC)">✏️ ${esc(note)}<br>Em thử nói: <b>${esc(q[2])}</b></p>
      ${nt.tries >= 2 ? `<button class="btn ghost" id="ntn" style="margin-top:10px">Bỏ qua, câu tiếp ›</button>` : ""}`;
    if($("ntn")) $("ntn").onclick = ()=>{ nt.i++; ntDraw(); };
    tanSay(note + " Em nói lại theo mình nhé.", q[2]);
  }
}
function ntEnd(){
  const t = nt.t; S.talkStory[t.id] = TODAY; logOf(TODAY).s += nt.right; save();
  const bad = nt.log.filter(x=>!x.ok);
  const one = bad[0];
  if(one) addFix("Trò chuyện về truyện · " + t.title, one.note, one.model); else addFix("Trò chuyện về truyện · " + t.title, "", "");
  if(!one) S.fixes[S.fixes.length-1].ok = true, save();
  $("ntbox").innerHTML = `<div class="flash" style="min-height:0"><div style="font-size:48px">${nt.right===nt.Q.length ? "🌟" : "👍"}</div>
    <h2>Em trả lời đúng ngay ${nt.right}/${nt.Q.length} câu</h2></div>
    <ol class="fixlist">${nt.log.map(x=>`<li>${x.ok ? "✅" : "✏️"} <b>${esc(x.q)}</b><br><span class="small">Em: “${esc(x.a)}”</span>${x.ok ? "" : `<br><span class="small">Câu đúng: <b>${esc(x.model)}</b></span>`}</li>`).join("")}</ol>
    <div class="onebox"><b>🎯 Một điều cần sửa nhất</b><span>${esc(one ? one.note + " Ví dụ: " + one.model : "Em trả lời tốt cả 3 câu. Lần sau em thử nói câu dài hơn nhé!")}</span></div>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="ntagain">Hỏi lại từ đầu</button><a class="btn" href="#truyen">Truyện khác</a></div>`;
  $("ntagain").onclick = ()=>VIEWS["noi-truyen"](t.id);
  tanSay(one ? "Một điều cần sửa nhất: " + one.note : "Em trả lời giỏi lắm!", one ? one.model : "Great job!", !one);
  celebrate(checkBadges());
}

/* ================= Kiểm tra trình độ 5 phút ================= */
let pt = null;
VIEWS["kiem-tra"] = ()=>{
  const plan = [["6",3],["7",2],["8",2],["9",2],["10",2],["11",2],["12",2]], list = [];
  for(const [g,n] of plan){
    shuffle(BAI[g]).slice(0,n).forEach((U,k)=>{
      if(k % 2 === 1 && U.practice.length){ const p = pick(U.practice); list.push({g, q:p[0], o:shuffle(p[2]), a:p[1], u:U.u, src:`Lớp ${g}`}); }
      else { const i = Math.floor(Math.random()*U.words.length), w = U.words[i];
        const others = shuffle(U.words.filter((_,j)=>j!==i)).slice(0,3).map(x=>x[0]);
        list.push({g, q:`“${w[2]}” trong tiếng Anh là gì?`, o:shuffle([w[0], ...others]), a:w[0], key:`${g}-${U.u}-${i}`, u:U.u, src:`Lớp ${g}`}); }
    });
  }
  pt = {list, i:0, by:{6:[0,0],7:[0,0],8:[0,0],9:[0,0],10:[0,0],11:[0,0],12:[0,0]}, miss:[]};
  app.innerHTML = header("Kiểm tra 5 phút", "15 câu, từ dễ (lớp 6) đến khó (lớp 12). Không tính điểm, chỉ để Tân biết em đang ở đâu.") + `
    <div class="card" id="ptbox" style="display:flex;flex-direction:column;gap:14px">
      ${tanBox("Câu nào em chưa biết thì bấm “Em chưa biết”, đừng đoán nhé. Như vậy Tân gợi ý bài đúng hơn.", "Let's start!")}
      ${S.placed ? `<p class="small muted">Lần trước em làm ngày ${esc(dayLabel(S.placed.d))}: đúng ${S.placed.total}/${S.placed.n} câu.</p>` : ""}
      <button class="btn big green" id="ptgo">Bắt đầu</button></div>`;
  bindGrade();
  $("ptgo").onclick = ptDraw;
};
function ptDraw(){
  const box = $("ptbox"); if(!box) return;
  if(pt.i >= pt.list.length) return ptEnd();
  const q = pt.list[pt.i];
  box.innerHTML = `<div class="top"><span class="counter">Câu ${pt.i+1}/${pt.list.length}</span><span class="small muted">${esc(q.src)}</span></div>
    <div class="bar"><i style="width:${Math.round(100*pt.i/pt.list.length)}%"></i></div>
    <p class="q">${esc(q.q)}</p><div class="opts">${q.o.map((o,k)=>`<button class="opt" data-o="${esc(o)}"><b style="background:${LETC[k]}">${LET[k]}</b><span>${esc(o)}</span></button>`).join("")}</div>
    <button class="btn ghost" id="ptno">🤔 Em chưa biết</button>`;
  const done = (right, btn)=>{
    if(box.dataset.done === "1") return; box.dataset.done = "1";
    const c = pt.by[q.g]; c[1]++; if(right) c[0]++; else pt.miss.push(q);
    box.querySelectorAll(".opt").forEach(x=>{ if(x.dataset.o === q.a) x.classList.add("right"); });
    if(btn && !right) btn.classList.add("wrong");
    setTimeout(()=>{ box.dataset.done = ""; pt.i++; ptDraw(); }, right ? 600 : 1300);
  };
  box.querySelectorAll(".opt").forEach(b=>b.onclick = ()=>done(b.dataset.o === q.a, b));
  $("ptno").onclick = ()=>done(false, null);
}
function ptEnd(){
  let L = 5, total = 0, n = 0;
  for(const g of ["6","7","8","9","10","11","12"]){ const [c, m] = pt.by[g]; total += c; n += m; }
  for(const g of [6,7,8,9,10,11,12]){ const [c, m] = pt.by[g]; if(m && c/m >= 0.5) L = g; else break; }
  const cur = Math.min(12, gNum());
  // từ sai được đưa vào Sổ từ để ôn ngay hôm nay; câu ngữ pháp sai ở lớp dưới thì thêm cả bài đó để ôn dần
  let seeded = 0, units = 0;
  for(const q of pt.miss){
    if(q.key && !S.srs[q.key]){ S.srs[q.key] = [1, TODAY]; seeded++; }
    if(+q.g < cur && !S.extra[q.g + "-" + q.u]){ S.extra[q.g + "-" + q.u] = 1; units++; }
  }
  S.placed = {d:TODAY, total, n, by:pt.by, L}; save();
  let msg, go;
  if(total <= 3){ msg = "Em nên học lại từ đầu: phần Chữ cái và âm, rồi đến các bài lớp 6. Mỗi ngày 5 phút là tiến bộ nhanh thôi!"; go = `<a class="btn green" href="#chu-cai">🔤 Học Chữ cái và âm</a>`; }
  else if(L < cur){ msg = `Em nắm khá chắc đến ${L >= 6 ? "lớp " + L : "các từ cơ bản"}. Phần lớp ${Math.max(6, L+1)} còn khó với em, Tân đã đưa các từ và bài em làm sai vào Sổ từ để em ôn dần.`; go = `<a class="btn green" href="#so-tu">📒 Ôn trong Sổ từ</a>`; }
  else { msg = `Em nắm tốt chương trình đến lớp ${L}. Em cứ học theo bài của tuần, và thử Truyện tranh, Nhập vai để nói nhiều hơn nhé.`; go = `<a class="btn green" href="#hom-nay">Về việc hôm nay</a>`; }
  $("ptbox").innerHTML = `<div class="flash" style="min-height:0"><div style="font-size:48px">🧭</div><h2>Em đúng ${total}/${n} câu</h2></div>
    ${["6","7","8","9","10","11","12"].map(g=>{ const [c,m] = pt.by[g]; return `<div class="ptbar"><span>Lớp ${g}</span><span><i style="width:${m ? Math.round(100*c/m) : 0}%"></i></span><b>${c}/${m}</b></div>`; }).join("")}
    ${tanBox(msg, "")}
    ${seeded || units ? `<p class="small muted">Đã thêm ${seeded} từ vào Sổ từ để ôn hôm nay${units ? ` và ${units} bài lớp dưới để ôn dần` : ""}.</p>` : ""}
    <div class="row" style="justify-content:center">${go}<button class="btn ghost" id="ptagain">Làm lại</button></div>`;
  $("ptagain").onclick = ()=>VIEWS["kiem-tra"]();
  tanSay(msg, "");
}

/* ================= Điều hướng ================= */
function route(){
  stopSpeak(); hidePop(); clearInterval(ctimer); if(window.TraTu) TraTu.close();
  if(reading){ try{ reading.stop(); }catch(e){} reading = null; }
  if(ls) ls.playing = false; if(sto) sto.auto = false;
  const h = (location.hash || "#hom-nay").slice(1), [name, arg] = h.split("/");
  const v = VIEWS[name] || VIEWS["hom-nay"];
  if(name !== "lop-hoc") document.body.classList.remove("class-on");
  const tabName = ({"noi-truyen":"truyen","kiem-tra":"hom-nay","do-nhanh":"hom-nay","chu-cai":"them","nghe":"them","lop-hoc":"them","thi-dua":"them","huy-hieu":"them","gop-y":"them"})[name] || name;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current", t.getAttribute("href")==="#"+tabName ? "page" : "false"));
  v(arg);
  window.scrollTo(0,0);
}
addEventListener("hashchange", route);
route();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
