<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5C45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Học mỗi ngày · Tiếng Anh 5 phút</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: một cột như điện thoại, thanh chuyển mục ở đáy; chế độ lớp học dùng toàn màn hình để chiếu */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --ink:#16302A; --muted:#55706A; --line:#D6E0DA;
  --board:#1F5C45; --board-ink:#F4F8F2; --chalk:#E8B931; --chalk-ink:#2A2206; --soft:#E7F0EA;
  --ok:#1E8A55; --ok-soft:#DDF2E6; --bad:#C2551F; --bad-soft:#FBE6DA; --sun-soft:#FFF1C9;
  --a:#D9483B; --b:#2F74C0; --c:#E3A21A; --d:#2E9A5B;
  --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  color-scheme:dark;
  --bg:#0E1D18; --surface:#16291F; --ink:#E6EFE9; --muted:#9DB5AB; --line:#2A4238;
  --board:#1B4A38; --board-ink:#EEF5EF; --chalk:#F0C849; --chalk-ink:#241C02; --soft:#1C3329;
  --ok:#5CC98F; --ok-soft:#173A28; --bad:#F09466; --bad-soft:#3E2418; --sun-soft:#3A3220;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:12px 24px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800}
h2{font-size:24px;font-weight:800}
h3{font-size:18px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.home-link{font-weight:600;font-size:14px;text-decoration:none;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px;max-width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{border:0;background:var(--chalk);color:var(--chalk-ink);font-weight:700;padding:11px 16px;border-radius:12px;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.green{background:var(--board);color:var(--board-ink)}
.btn.big{font-size:18px;min-height:56px;padding:12px 20px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.w:focus-visible,.opt:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* Tân và bong bóng lời */
.tan{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:end}
.tan svg{width:86px;height:96px;display:block}
.bubble{background:var(--surface);border:2px solid var(--board);border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:15.5px;min-width:0}
.bubble .en{display:block;font-weight:700;margin-top:4px}
.blink{animation:blink 4.2s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.m-open{display:none}.talking .m-open{display:inline}.talking .m-smile{display:none}
.tanhead{transform-box:fill-box;transform-origin:50% 90%}
.talking .tanhead{animation:talk .8s ease-in-out infinite}
@keyframes talk{30%{transform:rotate(3deg)}70%{transform:rotate(-2deg)}}
.cheer .tanhead{animation:hop .5s ease 2}
@keyframes hop{50%{transform:translateY(-6px)}}

/* Hôm nay */
.hero{background:var(--board);color:var(--board-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero .bubble{color:var(--ink)}
.streak{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.streak .lbl{white-space:nowrap}
.flame{font-size:40px;line-height:1}
.streak b{font:800 34px/1 var(--display);color:var(--chalk)}
.week7{display:flex;gap:6px;margin-left:auto}
.week7 span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.12);color:var(--board-ink)}
.week7 span.on{background:var(--chalk);color:var(--chalk-ink)}
.week7 span.today{outline:2px solid var(--chalk);outline-offset:1px}
.tasks{display:flex;flex-direction:column;gap:10px}
.task{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:inherit;min-height:68px}
.task .ic{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:22px}
.task.done .ic{background:var(--ok-soft)}
.task .t{font-weight:700;display:block}
.task .d{font-size:13.5px;color:var(--muted)}
.task .st{font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.task.done .st{color:var(--ok)}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:4px;align-items:center;min-height:92px;justify-content:center}
.tool span:first-child{font-size:28px;line-height:1}
.tool span:last-child{font-size:13.5px;font-weight:600}
.badges{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.bdg{flex:none;width:72px;text-align:center;font-size:11.5px;line-height:1.25;color:var(--muted)}
.bdg i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 4px;border-radius:50%;background:var(--soft);font-size:26px;font-style:normal;filter:grayscale(1);opacity:.45}
.bdg.on{color:var(--ink)}.bdg.on i{filter:none;opacity:1;background:var(--chalk-soft,#FFF3CC);box-shadow:0 0 0 2px var(--chalk)}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}

/* Thẻ từ */
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px 16px}
.flash .wd{font:800 40px/1.1 var(--display);word-break:break-word}
.flash .ipa{color:var(--muted)}
.flash .stress{font-size:18px;letter-spacing:.5px;min-height:1px}
.pa-st{color:var(--bad,#C2452D);font-weight:800}.pa-dot{font-style:normal;opacity:.45;margin:0 1px}
.pa-tip{background:var(--sun-soft,#FFF1C9);border-radius:10px;padding:9px 11px;font-size:14.5px;line-height:1.45}
.pa-tip .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}.pa-tip .hd b{font-size:17px}
.pa-tip .hd .btn{padding:5px 10px;font-size:13px;margin-left:auto}
.onebox{background:var(--sun-soft,#FFF1C9);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.chart svg{width:100%;height:auto;display:block}
.fixlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.fixlist li{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px}
.ptbar{display:grid;grid-template-columns:52px 1fr 40px;gap:8px;align-items:center;font-size:14px}
.ptbar i{display:block;height:12px;border-radius:6px;background:var(--board)}
.ptbar span:nth-child(2){background:var(--line);border-radius:6px;overflow:hidden}
.flash .vi{font-size:22px;font-weight:700;color:var(--board)}
@media (prefers-color-scheme: dark){.flash .vi{color:var(--chalk)}}
.flash .ex{font-size:15.5px}
.flash .exvi{font-size:14px;color:var(--muted)}
.counter{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:14px}

/* Đọc to */
.sent{font:600 24px/1.5 var(--body);display:flex;flex-wrap:wrap;gap:4px 8px}
.w{cursor:pointer;border-radius:6px;padding:0 3px;border:0;background:none;font:inherit;color:inherit}
.w.ok{background:var(--ok-soft);color:var(--ok)}
.w.miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.w.now{background:var(--chalk);color:var(--chalk-ink)}
.score{font:800 28px/1 var(--display)}
.rec-dot{width:12px;height:12px;border-radius:50%;background:#D9483B;display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.note{font-size:13.5px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px}

/* Câu hỏi */
.q{font:600 21px/1.4 var(--body)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;min-height:54px;font-size:17px}
.opt b{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:15px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{font-size:15px;border-left:4px solid var(--chalk);padding:8px 12px;background:var(--soft);border-radius:0 10px 10px 0}

/* Truyện */
.storylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:150px}
.story .cv{font-size:40px;line-height:1}
.story b{font-family:var(--display);font-size:17px;line-height:1.2}
.story.read{border-color:var(--ok)}
.panel{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.scene{font-size:72px;line-height:1.1;background:linear-gradient(var(--soft),var(--surface));border-radius:18px;width:100%;padding:28px 10px;letter-spacing:8px}
.panel .sent{justify-content:center}
.panel .vi{color:var(--muted);font-size:16px}
.pop{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,420px);background:var(--surface);border:2px solid var(--board);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:30;display:flex;flex-direction:column;gap:8px}
.pop .pw{font:800 26px/1.1 var(--display)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--board)}

/* Chữ cái */
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.abc button{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:800 28px/1 var(--display);cursor:pointer;position:relative}
.abc button.seen::after{content:"✓";position:absolute;top:3px;right:6px;font-size:12px;color:var(--ok)}
.letter{font:800 96px/1 var(--display);color:var(--board);text-align:center}
@media (prefers-color-scheme: dark){.letter{color:var(--chalk)}}
.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pic{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.pic span:first-child{font-size:44px;line-height:1.1}
.pic b{font-size:16px}
.pic small{color:var(--muted);font-size:12.5px}
.pic.right{border:2px solid var(--ok);background:var(--ok-soft)}
.pic.wrong{border:2px solid var(--bad);background:var(--bad-soft)}

/* Bài nghe */
.transcript{font-size:16.5px;line-height:1.7}
.transcript span{cursor:pointer;border-radius:4px}
.transcript span.now{background:var(--chalk);color:var(--chalk-ink)}

/* Thi đua */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n{text-align:right;font-weight:700}
.report{background:var(--board);color:var(--board-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.report .big{font:800 44px/1 var(--display);color:var(--chalk)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stats div{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px}
.stats b{display:block;font:800 24px/1.1 var(--display)}

/* Góp ý */
.faces{display:flex;gap:6px;justify-content:space-between}
.faces button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);min-height:72px}
.faces button span{font-size:30px;line-height:1.1}
.faces button[aria-pressed="true"]{border-color:var(--board);background:var(--soft);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;cursor:pointer;font-size:14.5px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--board);color:var(--board-ink);border-color:var(--board)}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:96px;resize:vertical}
.fbitem{border-top:1px solid var(--line);padding-top:10px;font-size:14.5px}
.fbitem:first-of-type{border-top:0;padding-top:0}

/* Thanh chuyển mục */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:4px max(4px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px;min-height:56px;justify-content:center}
.tab span:first-child{font-size:22px;line-height:1}
.tab[aria-current="page"]{color:var(--board);background:var(--soft)}
@media (prefers-color-scheme: dark){.tab[aria-current="page"]{color:var(--chalk)}}

/* Chế độ lớp học: chữ to để chiếu lên tivi */
body.class-on{padding-bottom:16px}
body.class-on .wrap{max-width:none}
body.class-on nav.tabs{display:none}
.cls{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.cls .q{font-size:clamp(24px,4.4vw,48px);line-height:1.25;text-align:center}
.cls .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
.cls .opt{font-size:clamp(18px,3vw,34px);min-height:clamp(64px,12vh,120px);color:#fff;border:0}
.cls .opt b{background:rgba(0,0,0,.18);width:clamp(36px,5vw,60px);height:clamp(36px,5vw,60px);font-size:clamp(18px,3vw,32px)}
.cls .opt.dim{opacity:.25}
.cls .opt.right{outline:6px solid var(--ink);opacity:1}
.timer{height:16px;border-radius:99px;background:var(--soft);overflow:hidden}
.timer i{display:block;height:100%;background:var(--chalk);transition:width 1s linear}
.teams{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.team{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;min-width:120px;text-align:center;cursor:pointer}
.team b{display:block;font:800 30px/1 var(--display)}
.team.hit{border-color:var(--ok);background:var(--ok-soft)}
/* Kết quả 3 mức và tốc độ nói */
.w.near{background:#FFF1C9;color:#875F00;text-decoration:underline dotted}
.lv{display:inline-flex;align-items:center;gap:6px;font-weight:700;border-radius:99px;padding:3px 11px;font-size:14px;white-space:nowrap}
.lv.ok{background:var(--ok-soft);color:var(--ok)}.lv.near{background:#FFF1C9;color:#875F00}.lv.bad{background:var(--bad-soft);color:var(--bad)}
@media (prefers-color-scheme: dark){.w.near,.lv.near{background:#3A3220;color:#F5C350}}
.pop{max-height:calc(100vh - 120px);overflow:auto}

/* Bài thầy cô giao, bộ từ */
.asg{border-left:5px solid var(--chalk);display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.due{font-weight:700;font-size:14px}.due.late{color:var(--bad)}.due.soon{color:#B7791F}
@media (prefers-color-scheme: dark){.due.soon{color:var(--chalk)}}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.items li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.items li.done{border-color:var(--ok);background:var(--ok-soft)}
.items .btn{min-height:38px;padding:6px 12px;font-size:14px}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:center;min-height:36px}
.checks input,.checkrow input{width:20px;height:20px;flex:none}
.linkbox{min-height:76px;font-size:13px;word-break:break-all}
.form{display:flex;flex-direction:column;gap:10px}
.form label.small{font-weight:600}
input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px}
.wl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wl li{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding:6px 0;flex-wrap:wrap}
.wl li b{font-size:17px}
.zalo{background:#FFF1C9;color:#4A3800;border-radius:12px;padding:10px 12px;font-size:14px}
@media (prefers-color-scheme: dark){.zalo{background:#3A3220;color:#F5E3B0}}

/* Nối cặp, từ khác loại, nói điền chỗ trống */
.pairs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:8px}
.pbtn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;min-height:54px;cursor:pointer;font-size:16px;text-align:center;word-break:break-word}
.pbtn.sel{border-color:var(--chalk);background:var(--soft);box-shadow:0 0 0 2px var(--chalk)}
.pbtn.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default}
.pbtn.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--chalk);text-align:center;color:var(--muted)}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.near{color:#875F00;border-color:#E3A21A}.blank.bad{color:var(--bad);border-color:var(--bad)}
.hintrow{display:flex;gap:8px;flex-wrap:wrap}
.demo{background:var(--soft);border-radius:12px;padding:14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;position:relative;min-height:70px;font-weight:600}
.dm-b{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:6px 10px}
.demo-noicap .dm-b{animation:dmok 2.6s infinite}
@keyframes dmok{0%,60%{border-color:var(--line);background:var(--surface)}70%,100%{border-color:var(--ok);background:var(--ok-soft)}}
.dm-f{position:absolute;font-size:26px;left:22%;top:36px;animation:dmf 2.6s infinite}

<script>
"use strict";
/* ================= Lưu trữ trên máy (không cần tài khoản) ================= */
const KEY = "hmn-v1";
let S = load();
function load(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  s = s || {};
  const def = {grade:null,name:"",cls:"",srs:{},custom:{},log:{},streak:{last:-9,count:0,best:0,freeze:-1},badges:{},stories:{},letters:{},listen:{},extra:{},teams:null,newDay:-1,newCount:0,feedback:[],askDay:-99,reads:{},fixes:[],placed:null,talkStory:{},assign:[],done:{},help:{},sets:[],paceLog:{},teacher:"",talk1:[]};
  for(const k in def) if(s[k]===undefined) s[k]=def[k];
  if(!s.grade){ let g="6"; try{ g = localStorage.getItem("grade") || "6"; }catch(e){} s.grade = g; }
  return s;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ================= Ngày, tuần học ================= */
const DAY = 86400000;
function dayNum(d){ d = d || new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset()*60000)/DAY); }
const TODAY = dayNum();
const SCHOOL_START = dayNum(new Date(2026, 8, 7)); // Thứ Hai 7/9/2026 là tuần 1
function schoolWeek(){ return Math.max(1, Math.min(35, Math.floor((TODAY - SCHOOL_START)/7) + 1)); }
function mondayOf(d){ const wd = (d + 3) % 7; return d - wd; } // ngày 0 (1/1/1970) là thứ Năm
const VN_DAYS = ["T2","T3","T4","T5","T6","T7","CN"];
function logOf(d){ return S.log[d] || (S.log[d] = {r:0,s:0,q:0,t:[0,0,0]}); }

/* ================= Dữ liệu bài học ================= */
const gNum = ()=> parseInt(S.grade,10);
const srcGrade = ()=> String(Math.min(12, Math.max(6, gNum())));
function unitStartWeek(u){ return parseInt(String(u.week).split(/[–-]/)[0],10); }
function learnedUnits(){
  // Các bài đã tới tuần học + bài em tự thêm.
  const out = [];
  const g = srcGrade(), wk = schoolWeek();
  for(const u of BAI[g]) if(unitStartWeek(u) <= wk) out.push([g, u.u]);
  for(const k in S.extra){ const [eg, eu] = k.split("-"); if(!out.some(x=>x[0]===eg && x[1]==+eu)) out.push([eg, +eu]); }
  return out;
}
function unitOf(g,u){ return (BAI[g]||[]).find(x=>x.u==u); }
function wordOf(key){
  if(key.startsWith("c|")){ const w = key.slice(2), c = S.custom[w]; return c ? {w, ipa:"", vi:c[0], ex:c[1]||"", exvi:c[2]||"", src: c[3] ? "Bộ từ · " + c[3] : "Từ em lưu"} : null; }
  const [g,u,i] = key.split("-"); const U = unitOf(g,u); if(!U || !U.words[i]) return null;
  const x = U.words[i]; return {w:x[0], ipa:x[1], vi:x[2], ex:x[3], exvi:x[4], src:`Lớp ${g} · Unit ${u}`};
}
function allLearnedKeys(){
  const keys = [];
  for(const [g,u] of learnedUnits()){ const U = unitOf(g,u); if(U) U.words.forEach((_,i)=>keys.push(`${g}-${u}-${i}`)); }
  for(const w in S.custom) keys.push("c|"+w);
  return keys;
}
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

/* ================= Lặp lại ngắt quãng (kiểu Anki, hộp Leitner) ================= */
const GAP = [0,1,3,7,14,30,60]; // số ngày chờ trước lần ôn tiếp theo, theo từng hộp
const NEW_PER_DAY = 6, MAX_DUE = 20;
function dueKeys(){ return Object.keys(S.srs).filter(k=>S.srs[k][1] <= TODAY && wordOf(k)).sort((a,b)=>S.srs[a][1]-S.srs[b][1]); }
function newKeys(){
  if(S.newDay !== TODAY){ S.newDay = TODAY; S.newCount = 0; }
  const left = Math.max(0, NEW_PER_DAY - S.newCount);
  return allLearnedKeys().filter(k=>!S.srs[k]).slice(0, left);
}
function grade(key, remembered){
  const cur = S.srs[key] || [0, TODAY];
  if(!S.srs[key]) S.newCount++;
  const box = remembered ? Math.min(GAP.length-1, cur[0]+1) : 1;
  S.srs[key] = [box, TODAY + (remembered ? GAP[box] : 0)];
  logOf(TODAY).r++;
  save();
}
function mastered(){ return Object.values(S.srs).filter(v=>v[0]>=4).length; }

/* ================= Giọng đọc của điện thoại (miễn phí) ================= */
const synth = window.speechSynthesis;
let enVoice = null, viVoice = null;
function pickVoices(){
  if(!synth) return;
  const all = synth.getVoices();
  const en = all.filter(v=>/^en[-_]/i.test(v.lang));
  enVoice = en.find(v=>/en[-_](GB|US)/i.test(v.lang) && /google|samantha|daniel|libby|sonia|zira/i.test(v.name)) || en[0] || null;
  viVoice = all.find(v=>/^vi/i.test(v.lang)) || null;
}
if(synth){ pickVoices(); synth.onvoiceschanged = pickVoices; }
function say(text, opt){
  opt = opt || {};
  return new Promise(res=>{
    if(!synth){ setTimeout(res, 400); return; }
    const vi = opt.lang === "vi";
    if(vi && !viVoice){ setTimeout(res, 300); return; }
    try{
      if(!opt.queue) synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if(vi){ u.voice = viVoice; u.lang = viVoice.lang; }
      else { if(enVoice) u.voice = enVoice; u.lang = enVoice ? enVoice.lang : "en-GB"; }
      u.rate = opt.rate || (vi ? 1 : 0.85);
      u.pitch = opt.pitch || 1.05;
      if(opt.onWord) u.onboundary = e=>{ if(e.name !== "sentence") opt.onWord(e.charIndex); };
      let done = false; const fin = ()=>{ if(!done){ done = true; res(); } };
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 1500 + text.length * 110);
      synth.speak(u);
    }catch(e){ res(); }
  });
}
function stopSpeak(){ if(synth) synth.cancel(); }

/* ================= Phát âm: trọng âm và mẹo sửa âm ================= */
function paReady(){ return window.PhatAm ? PhatAm.load() : Promise.resolve(); }
function paTipHTML(w){
  if(!window.PhatAm) return "";
  const I = PhatAm.info(w), t = PhatAm.tips(w, 1)[0], st = PhatAm.stressHTML(w);
  if(!t && !st) return "";
  return `<div class="pa-tip"><div class="hd"><b>${st || esc(w)}</b><span class="muted small">${esc(I.ipa)}</span>
    <button class="btn ghost" data-slow="${esc(w)}">🐢 Nghe chậm</button></div>${t ? `<b class="small">${esc(t.t)}</b><br>${esc(t.d)}` : ""}</div>`;
}
function bindSlow(root){ root.querySelectorAll("[data-slow]").forEach(b=>b.onclick = ()=>say(b.dataset.slow, {rate:0.45})); }
function addFix(src, t, ex){ S.fixes = (S.fixes||[]).slice(-29); S.fixes.push({d:TODAY, src, t, ex}); save(); }

/* ================= Nhân vật Tân ================= */
function tanSVG(plain){
  return `<svg viewBox="0 0 160 180" aria-hidden="true"${plain ? ' xmlns="http://www.w3.org/2000/svg" width="320" height="360"' : ""}><g class="tanbody">
    <path d="M14 180 Q16 128 80 122 Q144 128 146 180 Z" fill="#FFFFFF" stroke="#3E7CB1" stroke-width="3"/>
    <path d="M62 124 L80 140 L98 124" fill="none" stroke="#3E7CB1" stroke-width="4"/>
    <path d="M64 124 L96 124 L84 136 L92 158 L80 148 L70 160 L76 136 Z" fill="#D2342C"/>
    <g class="tanhead">
      <rect x="70" y="100" width="20" height="26" rx="8" fill="#D9A47C"/>
      <ellipse cx="80" cy="64" rx="42" ry="46" fill="#EDC19C"/>
      <ellipse cx="38" cy="68" rx="7" ry="10" fill="#D9A47C"/><ellipse cx="122" cy="68" rx="7" ry="10" fill="#D9A47C"/>
      <path d="M38 54 Q36 8 80 6 Q124 8 122 54 Q118 34 102 28 Q94 38 78 32 Q62 40 48 36 Q40 44 38 54 Z" fill="#2B1D16"/>
      <g stroke="#2B1D16" stroke-width="3" stroke-linecap="round"><path d="M58 50 Q65 46 72 50"/><path d="M88 50 Q95 46 102 50"/></g>
      <g class="blink" fill="#1C1C1C"><ellipse cx="65" cy="66" rx="4.5" ry="5.5"/><ellipse cx="95" cy="66" rx="4.5" ry="5.5"/></g>
      <g fill="#E8838A" opacity=".45"><ellipse cx="55" cy="82" rx="7" ry="4"/><ellipse cx="105" cy="82" rx="7" ry="4"/></g>
      <path class="m-smile" d="M68 88 Q80 98 92 88" fill="none" stroke="#7A3B2E" stroke-width="3.5" stroke-linecap="round"/>
      ${plain ? "" : `<g class="m-open"><ellipse cx="80" cy="92" rx="10" ry="8" fill="#7A3B2E"/><ellipse cx="80" cy="96" rx="6" ry="3" fill="#E8838A"/></g>`}
      ${!plain && window.KhauHinh ? KhauHinh.shapes(80, 92) : ""}
    </g></g></svg>`;
}
function tanBox(vi, en){
  return `<div class="tan" id="tanbox"><div id="tanfig">${tanSVG()}</div>
    <div class="bubble" id="tanbubble">${esc(vi)}${en?`<span class="en">${esc(en)}</span>`:""}</div></div>`;
}
async function tanSay(vi, en, cheer){
  const fig = document.getElementById("tanfig"), bub = document.getElementById("tanbubble");
  if(bub) bub.innerHTML = esc(vi) + (en ? `<span class="en">${esc(en)}</span>` : "");
  if(fig){ fig.classList.add("talking"); if(cheer) fig.classList.add("cheer"); }
  const K = window.KhauHinh;
  if(vi){ const id = K && fig && viVoice ? K.start(fig, vi, "vi", 1) : 0; await say(vi, {lang:"vi"}); if(id) K.stop(id); }
  if(en){ const id = K && fig ? K.start(fig, en, "en", 0.85) : 0; await say(en, {queue:true}); if(id) K.stop(id); }
  if(fig){ fig.classList.remove("talking"); setTimeout(()=>fig.classList.remove("cheer"), 1200); }
}
const PRAISE = [
  ["Giỏi lắm! Em làm xong rồi.","Well done!"],["Tuyệt vời! Mai mình học tiếp nhé.","Great job! See you tomorrow."],
  ["Em tiến bộ nhiều lắm!","You're getting better and better!"],["Cố gắng của em thật đáng khen.","I'm proud of you!"],
  ["Hay quá! Chuỗi ngày học của em lại dài thêm.","Keep it up!"]];
const pick = a=>a[Math.floor(Math.random()*a.length)];

/* ================= Huy hiệu ================= */
const BADGES = [
  ["first","🌱","Ngày đầu tiên","Hoàn thành việc hôm nay lần đầu",()=>S.streak.best>=1],
  ["s3","🔥","3 ngày liền","Học 3 ngày liên tiếp",()=>S.streak.best>=3],
  ["s7","⭐","1 tuần liền","Học 7 ngày liên tiếp",()=>S.streak.best>=7],
  ["s30","🏆","30 ngày liền","Học 30 ngày liên tiếp",()=>S.streak.best>=30],
  ["w50","📒","50 lần ôn từ","Ôn từ 50 lần",()=>sumLog("r")>=50],
  ["w300","📚","300 lần ôn từ","Ôn từ 300 lần",()=>sumLog("r")>=300],
  ["m20","🧠","Nhớ chắc 20 từ","20 từ đã lên hộp 4 trở lên",()=>mastered()>=20],
  ["r20","🎤","Đọc to 20 câu","Đọc to được 20 câu",()=>sumLog("s")>=20],
  ["r100","🗣️","Đọc to 100 câu","Đọc to được 100 câu",()=>sumLog("s")>=100],
  ["q50","✅","50 câu đúng","Trả lời đúng 50 câu hỏi",()=>sumLog("q")>=50],
  ["story1","📖","Đọc truyện đầu tiên","Đọc hết một truyện",()=>Object.keys(S.stories).length>=1],
  ["story5","🎒","Mọt sách nhỏ","Đọc hết 5 truyện",()=>Object.keys(S.stories).length>=5],
  ["abc","🔤","Thuộc bảng chữ cái","Xem hết 26 chữ cái",()=>Object.keys(S.letters).length>=26],
  ["listen","🎧","Tai thính","Làm đúng 4/5 một bài nghe",()=>Object.values(S.listen).some(v=>v>=4)]
];
function sumLog(f){ let n=0; for(const d in S.log) n += S.log[d][f]||0; return n; }
function checkBadges(){
  const got = [];
  for(const b of BADGES) if(!S.badges[b[0]] && b[4]()){ S.badges[b[0]] = TODAY; got.push(b); }
  if(got.length) save();
  return got;
}

/* ================= Việc hôm nay và chuỗi ngày ================= */
function dayLabel(d){ const x = new Date(d*DAY); return d===TODAY ? "Hôm nay" : d===TODAY-1 ? "Hôm qua" : `${x.getUTCDate()}/${x.getUTCMonth()+1}`; }
function readChart(){
  const weeks = [];
  for(let k=7;k>=0;k--){ const mon = mondayOf(TODAY) - 7*k; let s=0, n=0;
    for(let d=mon; d<mon+7; d++){ const r = (S.reads||{})[d]; if(r){ s += r[0]; n += r[1]; } }
    weeks.push({mon, avg: n ? Math.round(s/n) : null, n}); }
  if(!weeks.some(w=>w.n)) return `<p class="small muted">Chưa có điểm. Em vào Đọc to, bấm micro và đọc vài câu nhé.</p>`;
  const W = 320, H = 150, bw = 26, gap = (W - 8*bw) / 8, base = 118;
  const bars = weeks.map((w,i)=>{ const x = gap/2 + i*(bw+gap), h = w.avg==null ? 0 : Math.max(3, Math.round(96*w.avg/100)), cur = i===7;
    const d = new Date(w.mon*DAY), lbl = `${d.getUTCDate()}/${d.getUTCMonth()+1}`;
    return `<g><rect x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="4" fill="${cur ? "var(--sun,#F2B33D)" : "var(--board,#2F6B57)"}"><title>Tuần ${lbl}: ${w.avg==null ? "chưa đọc" : w.avg + "% (" + w.n + " câu)"}</title></rect>
      ${w.avg==null ? "" : `<text x="${x+bw/2}" y="${base-h-5}" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">${w.avg}</text>`}
      <text x="${x+bw/2}" y="${base+16}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".7">${lbl}</text></g>`; }).join("");
  const last = weeks[7], prev = weeks.slice(0,7).filter(w=>w.avg!=null).pop();
  const note = last.avg==null ? "Tuần này em chưa đọc to." : prev ? (last.avg >= prev.avg ? `Tuần này ${last.avg}%, tăng ${last.avg-prev.avg} điểm so với lần trước. Tốt lắm!` : `Tuần này ${last.avg}%, giảm ${prev.avg-last.avg} điểm. Em nghe mẫu chậm rồi đọc lại nhé.`) : `Tuần này ${last.avg}%.`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ điểm đọc to 8 tuần. ${esc(note)}"><line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="currentColor" opacity=".25"/>${bars}</svg><p class="small" style="margin-top:4px">${esc(note)}</p>`;
}
const TASKS = [
  ["📒","Ôn từ","Sổ từ tự nhắc từ sắp quên","#so-tu"],
  ["🎤","Đọc to 3 câu","Máy nghe và tô màu từ đọc sai","#doc-to"],
  ["❓","Đố nhanh 5 câu","Ôn ngữ pháp và từ vựng","#do-nhanh"]
];
function shownStreak(){
  const st = S.streak;
  if(st.last >= TODAY-1) return st.count;
  if(st.last === TODAY-2 && st.freeze !== mondayOf(TODAY)) return st.count; // còn 1 ngày nghỉ trong tuần
  return 0;
}
function markTask(i){
  const L = logOf(TODAY);
  if(L.t[i]) return [];
  L.t[i] = 1;
  const msgs = [];
  if(L.t.every(Boolean)){
    const st = S.streak;
    if(st.last === TODAY-1) st.count++;
    else if(st.last === TODAY-2 && st.freeze !== mondayOf(TODAY)){ st.count++; st.freeze = mondayOf(TODAY); }
    else if(st.last !== TODAY) st.count = 1;
    st.last = TODAY; st.best = Math.max(st.best, st.count);
    msgs.push("day");
  }
  save();
  return msgs.concat(checkBadges());
}
async function celebrate(res){
  if(!res || !res.length) return;
  const bs = res.filter(x=>Array.isArray(x));
  if(res.includes("day")){
    const p = pick(PRAISE);
    showPop(`<div class="pw">🔥 ${shownStreak()} ngày liền!</div><p>Em đã xong cả 3 việc hôm nay.</p>${bs.map(b=>`<p>Huy hiệu mới: <b>${b[1]} ${esc(b[2])}</b></p>`).join("")}${quickAsk()}<div class="row"><button class="btn" onclick="hidePop()">Tuyệt quá</button><button class="btn ghost" onclick="shareCard()">📸 Khoe thành tích</button></div>`);
    tanSay(p[0], p[1], true);
  }else if(bs.length){
    showPop(`<div class="pw">${bs[0][1]} Huy hiệu mới!</div><p><b>${esc(bs[0][2])}</b>: ${esc(bs[0][3])}</p><div class="row"><button class="btn" onclick="hidePop()">Hay quá</button><button class="btn ghost" onclick="shareCard()">📸 Khoe thành tích</button></div>`);
  }
}

/* ================= Tiện ích giao diện ================= */
/* Chép chữ: một số trình duyệt trong app (Zalo, Telegram) không trả lời, nên chờ tối đa 2 giây rồi cho em tự chép */
function clipWrite(text){
  if(!navigator.clipboard || !navigator.clipboard.writeText) return Promise.reject(new Error("noclip"));
  return Promise.race([navigator.clipboard.writeText(text), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")), 2000))]);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const $ = id=>document.getElementById(id);
const app = $("app");
function showPop(html){ const p = $("pop"); p.innerHTML = html; p.hidden = false; }
function hidePop(){ $("pop").hidden = true; }
const LET = ["A","B","C","D"], LETC = ["var(--a)","var(--b)","var(--c)","var(--d)"];
function gradeSelect(id){
  return `<select id="${id}" aria-label="Chọn lớp">${[6,7,8,9,10,11,12].map(g=>`<option value="${g}"${S.grade==g?" selected":""}>Lớp ${g}</option>`).join("")}</select>`;
}
function setGrade(g){
  S.grade = String(g); save();
  try{ localStorage.setItem("grade", String(g)); }catch(e){}
}

/* ================= Nhận giọng nói và so từng từ ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const NUMW = {one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",nine:"9",ten:"10"};
const SAMEW = {favorite:"favourite",color:"colour",neighbor:"neighbour",neighborhood:"neighbourhood",center:"centre",theater:"theatre",traveling:"travelling",realize:"realise",organize:"organise",math:"maths",ok:"okay"};
function normToks(s){
  return s.toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z0-9'\s-]/g," ").replace(/-/g," ")
    .split(/\s+/).filter(Boolean).map(w=>{ w = w.replace(/'s$/,"").replace(/'/g,""); return NUMW[w]||SAMEW[w]||w; });
}
/* Trả về mảng đúng/sai cho từng từ của câu mẫu (dựa trên dãy con chung dài nhất). */
function matchWords(model, said){
  const mw = model.split(/\s+/), m = mw.map(w=>normToks(w).join("")), s = normToks(said);
  const n = m.length, k = s.length;
  const L = Array.from({length:n+1},()=>new Array(k+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=k-1;j>=0;j--) L[i][j] = (m[i] && m[i]===s[j]) ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const ok = new Array(n).fill(false);
  let i=0, j=0;
  while(i<n && j<k){ if(m[i] && m[i]===s[j]){ ok[i]=true; i++; j++; } else if(L[i+1][j] >= L[i][j+1]) i++; else j++; }
  m.forEach((x,idx)=>{ if(!x) ok[idx]=true; }); // dấu câu đứng riêng
  return ok;
}
function listen(onText, onEnd){
  if(!SR){ onEnd("nosr"); return null; }
  const r = new SR();
  r.lang = "en-US"; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
  let best = "", err = null, t0 = 0, prev = 0, pauses = 0;
  r.onspeechstart = ()=>{ if(!t0) t0 = performance.now(); };
  r.onresult = e=>{ const now = performance.now(); if(!t0) t0 = now - 400; if(prev && now - prev > 1200) pauses++; prev = now;
    let t = ""; for(let i=0;i<e.results.length;i++) t += e.results[i][0].transcript + " "; best = t.trim(); onText(best, false); };
  r.onerror = e=>{ err = e.error; };
  r.onend = ()=>{ const words = best ? best.split(/\s+/).length : 0, sec = t0 && prev ? Math.max(0.6, (prev - t0 - 250)/1000) : 0;
    onEnd(err, best, sec ? {words, wpm: Math.round(words/sec*60), pauses} : null); };
  try{ r.start(); }catch(e){ onEnd("start"); return null; }
  return r;
}

/* Ghi âm để tự nghe lại (chạy cả khi không có mạng) */
let recState = null;
async function toggleRecord(btn, audioEl, onDone){
  if(recState){ recState.rec.stop(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const rec = new MediaRecorder(stream), chunks = [];
    rec.ondataavailable = e=>chunks.push(e.data);
    rec.onstop = ()=>{
      stream.getTracks().forEach(t=>t.stop());
      const url = URL.createObjectURL(new Blob(chunks, {type: rec.mimeType || "audio/webm"}));
      audioEl.src = url; audioEl.hidden = false; audioEl.play().catch(()=>{});
      btn.innerHTML = "⏺ Ghi âm lại"; recState = null; onDone && onDone();
    };
    rec.start(); recState = {rec};
    btn.innerHTML = '<span class="rec-dot"></span> Dừng ghi âm';
  }catch(e){
    btn.disabled = true; btn.textContent = "Máy chưa cho ghi âm";
  }
}

/* ================= Kết quả 3 mức: đúng, gần đúng, chưa đúng ================= */
function lev(a, b){
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_,j)=>j);
  for(let i=1;i<=m;i++){ const cur = [i]; for(let j=1;j<=n;j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function simWord(a, b){ if(!a || !b) return 0; return 1 - lev(a, b) / Math.max(a.length, b.length); }
/* Mỗi từ của câu mẫu: "ok" đọc đúng, "near" máy nghe ra từ gần giống, "miss" chưa đúng */
function matchLevels(model, said){
  const mw = model.split(/\s+/), m = mw.map(w=>normToks(w).join("")), s = normToks(said);
  const n = m.length, k = s.length;
  const L = Array.from({length:n+1},()=>new Array(k+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=k-1;j>=0;j--) L[i][j] = (m[i] && m[i]===s[j]) ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const pair = new Array(n).fill(-1), used = new Array(k).fill(false);
  let i=0, j=0;
  while(i<n && j<k){ if(m[i] && m[i]===s[j]){ pair[i]=j; used[j]=true; i++; j++; } else if(L[i+1][j] >= L[i][j+1]) i++; else j++; }
  const out = m.map((x,idx)=> !x || pair[idx] >= 0 ? "ok" : "miss");
  for(let a=0;a<n;a++){
    if(out[a] !== "miss") continue;
    let lo = -1, hi = k;
    for(let b=a-1;b>=0;b--) if(pair[b] >= 0){ lo = pair[b]; break; }
    for(let b=a+1;b<n;b++) if(pair[b] >= 0){ hi = pair[b]; break; }
    let best = -1, bs = 0;
    for(let c=lo+1;c<hi;c++){ if(used[c]) continue;
      let v = simWord(m[a], s[c]);
      // cùng 2 chữ đầu, dài gần bằng nhau (bag/back, cat/cap): thường là đọc sai âm cuối
      if(m[a].length >= 3 && s[c].slice(0,2) === m[a].slice(0,2) && Math.abs(s[c].length - m[a].length) <= 1) v = Math.max(v, 0.67);
      if(v > bs){ bs = v; best = c; } }
    const need = m[a].length <= 3 ? 0.66 : 0.6;
    if(best >= 0 && bs >= need){ out[a] = "near"; used[best] = true; }
  }
  return out;
}
function level3(pct){ return pct >= 85 ? ["ok","🟢 Tốt"] : pct >= 60 ? ["near","🟡 Gần đúng"] : ["bad","🟠 Cần luyện"]; }
/* Tiếng báo riêng cho từng mức (tự tạo bằng loa điện thoại, không cần file âm thanh) */
let actx3 = null;
function tone3(kind){
  try{
    actx3 = actx3 || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === "ok" ? [[660,0],[880,.11]] : kind === "near" ? [[523,0],[587,.12]] : [[330,0],[262,.14]];
    notes.forEach(([f,at])=>{
      const o = actx3.createOscillator(), g = actx3.createGain(), t = actx3.currentTime + at;
      o.type = kind === "bad" ? "triangle" : "sine"; o.frequency.value = f; o.connect(g); g.connect(actx3.destination);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .2);
      o.start(t); o.stop(t + .22);
    });
  }catch(e){}
}
/* Tốc độ nói: học sinh nên nói khoảng 80 đến 130 từ mỗi phút */
function paceInfo(p){
  if(!p || p.words < 3 || !p.wpm) return null;
  const w = p.wpm;
  const lv = w < 60 ? ["bad","hơi chậm","Em đọc liền mạch hơn, đừng dừng sau từng từ."]
    : w < 80 ? ["near","hơi chậm một chút","Em đọc liền các từ trong một cụm, ví dụ: in the morning."]
    : w <= 130 ? ["ok","vừa phải","Tốc độ rất tốt, dễ nghe."]
    : w <= 160 ? ["near","hơi nhanh","Em chậm lại một chút cho rõ từng từ."]
    : ["bad","nhanh quá","Em nói chậm lại, rõ từng từ."];
  return {wpm: w, pauses: p.pauses || 0, level: lv[0], label: lv[1], tip: (p.pauses||0) >= 2 ? `Em ngập ngừng ${p.pauses} lần. Em đọc thầm câu một lần rồi nói liền một hơi nhé.` : lv[2]};
}

const CORE = ["index.html","hoc-moi-ngay.html","du-lieu-bai.js","noi-dung-them.js","tra-tu.js","tu-dien.js","cau-vi.js","phat-am.js","phat-am-du-lieu.js","dt-them.js","khau-hinh.js","nhap-vai-gia-lai.html","the-tra-loi.html","manifest.webmanifest","icon-192.png","icon-512.png"];
function weekFiles(curU){
  const f = CORE.slice();
  if(curU) curU.links.forEach(l=>f.push(l[0]));
  return f;
}
function allFiles(){
  const f = CORE.slice();
  for(const g in BAI) for(const u of BAI[g]) u.links.forEach(l=>f.push(l[0]));
  for(const g in BAI) for(let k=1;k<=4;k++) f.push(`lop-${g}-on-tap-${k}.html`);
  return [...new Set(f)];

async function countCached(files){
  if(!("caches" in window)) return -1;
  let n = 0; for(const f of files){ try{ if(await caches.match(f, {ignoreSearch:true})) n++; }catch(e){} }
  return n;
}
async function offlineCard(curU){
  const st = $("offst"), bar = $("offbar"); if(!st) return;
  const wf = weekFiles(curU), af = allFiles();
  const show = async()=>{
    const w = await countCached(wf), a = await countCached(af);
    if(w < 0){ st.textContent = "Trình duyệt này chưa lưu được bài. Hãy mở bằng Chrome và cài app lên màn hình chính."; $("dlweek").disabled = $("dlall").disabled = true; return; }
    bar.style.width = Math.round(100*a/af.length) + "%";
    st.textContent = (w === wf.length ? "✓ Bài tuần này đã có trong máy. " : `Bài tuần này: ${w}/${wf.length} phần đã lưu. `) + `Cả năm: ${a}/${af.length} trang đã lưu.`;
  };
  const dl = async(files, btn)=>{
    btn.disabled = true; const old = btn.textContent; btn.textContent = "Đang tải…";
    try{
      const c = await caches.open("tai-ve-1"); let ok = 0;
      for(const f of files){ try{ const r = await fetch(f, {cache:"reload"}); if(r.ok){ await c.put(f, r); ok++; } }catch(e){} }
      btn.textContent = ok === files.length ? "✓ Đã tải xong" : `Tải được ${ok}/${files.length}. Có mạng hãy thử lại.`;
    }catch(e){ btn.textContent = "Chưa tải được. Hãy thử lại khi có mạng."; }
    setTimeout(()=>{ btn.textContent = old; btn.disabled = false; }, 3500);
    show();
  };
  $("dlweek").onclick = ()=>dl(wf, $("dlweek"));
  $("dlall").onclick = ()=>dl(af, $("dlall"));
  show();
}

let reading = null;
function startRead(){
  if(reading){ try{ reading.stop(); }catch(e){} return; }
  stopSpeak();
  const btn = $("rmic"), en = rd.src.sents[rd.i][0];

    const lv = matchLevels(en, text||""), ws = [...$("rsent").querySelectorAll(".w")];
    ws.forEach((w,k)=>{ w.classList.toggle("ok", lv[k]==="ok"); w.classList.toggle("near", lv[k]==="near"); w.classList.toggle("miss", lv[k]==="miss"); });
    const nOk = lv.filter(x=>x==="ok").length, nNear = lv.filter(x=>x==="near").length;

    const miss = en.split(/\s+/).filter((_,k)=>lv[k]!=="ok").map(w=>w.replace(/[^\w'-]/g,"")).filter(Boolean);

function makeQuestions(n, units){
  const pool = [];
  for(const [g,u] of units){ const U = unitOf(g,u); if(!U) continue;
    U.practice.forEach(p=>pool.push({q:p[0], o:p[2], a:p[1], why:p[3], src:`Unit ${u}`}));
    U.words.forEach((w,i)=>{ const others = shuffle(U.words.filter((_,j)=>j!==i)).slice(0,3).map(x=>x[0]);
      pool.push({q:`"${w[2]}" trong tiếng Anh là gì?`, o:[w[0], ...others], a:w[0], why:`${w[0]} ${w[1]}: ${w[2]}. Ví dụ: ${w[3]}`, src:`Unit ${u}`}); });
  }
  return shuffle(pool).slice(0, n).map(q=>({...q, o: shuffle(q.o)}));
}

function glossFor(t, word){
  const w = word.toLowerCase().replace(/[^a-z'-]/g,"");
  if(t.gl[w]) return [w, t.gl[w]];
  for(const k in t.gl) if(k.includes(" ") && k.split(" ").includes(w)) return [k, t.gl[k]];
  // tìm trong từ vựng các bài
  for(const g in BAI) for(const U of BAI[g]) for(const x of U.words) if(x[0].toLowerCase() === w) return [x[0], x[2]];
  return [w, null];
}

let cq = null, ctimer = null, actx = null;
function beep(f, ms){
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.15, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + ms/1000);
    o.start(); o.stop(actx.currentTime + ms/1000); }catch(e){}
}

let nt = null;
function ntNorm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/[’'`]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim(); }
VIEWS["noi-truyen"] = (arg)=>{
  const t = TRUYEN.find(x=>x.id===arg), Q = (window.TRUYEN_HOI||{})[arg];
  if(!t || !Q){ location.hash = "truyen"; return; }
  nt = {t, Q, i:0, right:0, tries:0, log:[]};
  app.innerHTML = `<div class="top"><a class="home-link" href="#truyen/${t.id}">← Truyện</a><span class="small muted">${esc(t.title)}</span></div>
    <div><h1>Trò chuyện với Tân</h1><p class="muted">Tân hỏi ${Q.length} câu về truyện “${esc(t.vi)}”. Em trả lời bằng tiếng Anh: bấm micro để nói, hoặc gõ chữ.</p></div>
    <div class="card" id="ntbox" style="display:flex;flex-direction:column;gap:12px"></div>`;
  ntDraw();
};
function ntDraw(){
  const box = $("ntbox"); if(!box) return;
  if(nt.i >= nt.Q.length) return ntEnd();
  const q = nt.Q[nt.i]; nt.tries = 0;
  box.innerHTML = `<div class="top"><span class="counter">Câu ${nt.i+1}/${nt.Q.length}</span><span class="small muted">${q[5] ? "Câu hỏi về em" : "Câu hỏi về truyện"}</span></div>
    ${tanBox(q[1], q[0])}
    <div class="row"><button class="btn ghost" id="ntq">🔊 Nghe lại câu hỏi</button><button class="btn ghost" id="nth">💡 Gợi ý</button></div>
    <p class="small" id="nthint" hidden></p>
    <button class="btn big green" id="ntmic">🎤 Bấm rồi trả lời</button>
    <div class="row"><input type="text" id="ntin" placeholder="Hoặc gõ câu trả lời…" style="flex:1;min-width:0" enterkeyhint="send" autocomplete="off"><button class="btn" id="ntsend">Gửi</button></div>
    <p class="small" id="ntheard"></p><div id="ntfb"></div>`;
  $("ntq").onclick = ()=>say(q[0], {rate:0.8});
  $("nth").onclick = ()=>{ const h = $("nthint"); h.hidden = false; h.innerHTML = `Em có thể nói: <b>${esc(q[2])}</b>`; say(q[2], {rate:0.8}); };
  $("ntsend").onclick = ()=>{ const v = $("ntin").value.trim(); if(v){ $("ntin").value = ""; ntJudge(v); } };
  $("ntin").onkeydown = e=>{ if(e.key==="Enter") $("ntsend").click(); };
  $("ntmic").onclick = ()=>{
    if(reading){ try{ reading.stop(); }catch(e){} return; }
    stopSpeak(); const btn = $("ntmic");
    btn.innerHTML = '<span class="rec-dot"></span> Tân đang nghe… (bấm để dừng)';
    reading = listen(tx=>{ $("ntheard").textContent = "Tân nghe được: " + tx; }, (err, tx)=>{
      reading = null; if($("ntmic")) $("ntmic").innerHTML = "🎤 Bấm rồi trả lời";
      if(err && !tx){ $("ntheard").textContent = srError(err) + " Em có thể gõ câu trả lời vào ô bên dưới."; return; }
      if(tx) ntJudge(tx);
    });
    if(!reading) btn.innerHTML = "🎤 Bấm rồi trả lời";
  };
  setTimeout(()=>tanSay("", q[0]), 200);
}
function ntJudge(text){
  const q = nt.Q[nt.i], n = ntNorm(text), ok = new RegExp(q[3]).test(n) && n.split(" ").length >= 2;
  $("ntheard").textContent = "Em trả lời: " + text;
  nt.tries++;
  if(ok){
    if(nt.tries === 1) nt.right++;
    if(nt.tries === 1) nt.log.push({q:q[0], a:text, ok:true, model:q[2]});
    $("ntfb").innerHTML = `<p class="why">✅ ${pick(["Đúng rồi!","Hay lắm!","Chính xác!"])} Câu trả lời đầy đủ: <b>${esc(q[2])}</b></p><button class="btn" id="ntn" style="margin-top:10px">${nt.i < nt.Q.length-1 ? "Câu tiếp ›" : "Xem kết quả ›"}</button>`;
    $("ntn").onclick = ()=>{ nt.i++; ntDraw(); };
    tanSay(pick(["Đúng rồi!","Hay lắm!","Em trả lời tốt lắm!"]), q[2], true);
  }else{
    const short = n.split(" ").length < 2;
    const note = short ? "Em trả lời bằng một câu đủ ý nhé, ít nhất vài từ." : q[4];
    if(nt.tries === 1) nt.log.push({q:q[0], a:text, ok:false, model:q[2], note});
    $("ntfb").innerHTML = `<p class="why" style="background:var(--bad-soft,#FBE3DC)">✏️ ${esc(note)}<br>Em thử nói: <b>${esc(q[2])}</b></p>
      ${nt.tries >= 2 ? `<button class="btn ghost" id="ntn" style="margin-top:10px">Bỏ qua, câu tiếp ›</button>` : ""}`;
    if($("ntn")) $("ntn").onclick = ()=>{ nt.i++; ntDraw(); };
    tanSay(note + " Em nói lại theo mình nhé.", q[2]);
  }
}
function ntEnd(){
  const t = nt.t; S.talkStory[t.id] = TODAY; logOf(TODAY).s += nt.right; save();
  const bad = nt.log.filter(x=>!x.ok);
  const one = bad[0];
  if(one) addFix("Trò chuyện về truyện · " + t.title, one.note, one.model); else addFix("Trò chuyện về truyện · " + t.title, "", "");
  if(!one) S.fixes[S.fixes.length-1].ok = true, save();

    <div class="onebox"><b>🎯 Một điều cần sửa nhất</b><span>${esc(one ? one.note + " Ví dụ: " + one.model : "Em trả lời tốt cả 3 câu. Lần sau em thử nói câu dài hơn nhé!")}</span></div>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="ntagain">Hỏi lại từ đầu</button><a class="btn" href="#truyen">Truyện khác</a></div>`;
  $("ntagain").onclick = ()=>VIEWS["noi-truyen"](t.id);
  tanSay(one ? "Một điều cần sửa nhất: " + one.note : "Em trả lời giỏi lắm!", one ? one.model : "Great job!", !one);
  celebrate(checkBadges());
}

    ${["6","7","8","9","10","11","12"].map(g=>{ const [c,m] = pt.by[g]; return `<div class="ptbar"><span>Lớp ${g}</span><span><i style="width:${m ? Math.round(100*c/m) : 0}%"></i></span><b>${c}/${m}</b></div>`; }).join("")}

/* ================= Đường link không cần máy chủ: dữ liệu nằm ngay trong link ================= */
function packCode(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj)); let bin = "";
  bytes.forEach(b=>{ bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unpackCode(code){
  try{
    let s = String(code||"").trim().replace(/-/g,"+").replace(/_/g,"/"); while(s.length % 4) s += "=";
    const bin = atob(s), bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    const o = JSON.parse(new TextDecoder().decode(bytes));
    return o && typeof o === "object" ? o : null;
  }catch(e){ return null; }
}
function appLink(hash){ return location.href.split("#")[0].split("?")[0] + "#" + hash; }
/* Link mở bên trong Zalo, Telegram, Messenger: trình duyệt riêng của các app này có bộ nhớ riêng, bài không vào app của em */

const inApp = /Zalo/i.test(UA) ? "Zalo" : /Telegram/i.test(UA) || typeof window.TelegramWebviewProxy !== "undefined" ? "Telegram" : /FBAN|FBAV|Messenger|Instagram/i.test(UA) ? "Messenger" : "";

function tgLink(url, text){ return "https://t.me/share/url?url=" + encodeURIComponent(url) + (text ? "&text=" + encodeURIComponent(text) : ""); }

async function shareOut(title, text, msgEl){
  if(navigator.share){ try{ await navigator.share({title, text}); msgEl.textContent = "Đã mở phần gửi. Chọn Zalo, Telegram hoặc Messenger."; return true; }catch(e){ if(e && e.name === "AbortError") return false; } }

function dmy(d){ const x = new Date(d*DAY); return `${x.getUTCDate()}/${x.getUTCMonth()+1}`; }

/* Đọc danh sách từ thầy cô gõ: mỗi dòng "từ = nghĩa = câu ví dụ = nghĩa câu" (dấu = có thể thay bằng | hoặc phím Tab) */
function parseWordLines(text){
  const words = [], bad = [];
  String(text||"").split(/\r?\n/).forEach((line, i)=>{
    const t = line.trim(); if(!t) return;
    let parts = t.split(/\s*(?:=|\||\t)\s*/);
    if(parts.length < 2) parts = t.split(/\s+[-–:]\s+/);
    const w = (parts[0]||"").trim(), vi = (parts[1]||"").trim();
    if(!w || !vi || !/[a-z]/i.test(w) || w.length > 40 || vi.length > 80){ bad.push(i+1); return; }
    if(words.some(x=>x[0].toLowerCase() === w.toLowerCase())) return;
    words.push([w, vi, (parts[2]||"").trim().slice(0,160), (parts[3]||"").trim().slice(0,160)]);
  });
  return {words: words.slice(0, 40), bad, over: words.length > 40};
}
function addWordSet(title, words){
  let added = 0;
  for(const [w, vi, ex, exvi] of words){
    if(!S.custom[w]) added++;
    S.custom[w] = [vi, ex || "", exvi || "", title];
    if(!S.srs["c|"+w]) S.srs["c|"+w] = [0, TODAY]; // học ngay hôm nay
  }
  save(); return added;
}

function itemDone(a, i){
  if(a.done && a.done[i]) return a.done[i];
  const it = a.it[i], href = it[0], kind = it[2] || "", g = a.g, u = a.u, since = a.got;
  const fixed = re=>{ const f = (S.fixes||[]).find(x=>x.d >= since && re.test(x.src||"")); return f ? f.d : 0; };
  if(kind === "bh"){ const key = (g === "6" && +u === 1) ? "u1done" : `g${g}u${u}done`; return lsDone(key) ? TODAY : 0; }
  if(kind === "ot"){ const m = href.match(/lop-(\d+)-on-tap-(\d)/); return m && lsDone(`g${m[1]}ur${m[2]}done`) ? TODAY : 0; }
  if(kind === "dt") return fixed(new RegExp(`^Lớp ${g} · Unit ${u} ·`));
  if(kind === "ntd") return fixed(new RegExp(`^Nói tự do · Lớp ${g} Unit ${u}$`));
  if(kind === "nv") return fixed(/Gia Lai/);
  if(kind.startsWith("app:")){ const d = S.done[kind.slice(4) + ":" + g + "-" + u]; return d && d >= since ? d : 0; }
  return 0;
}

function asgReport(a){

  let rs = 0, rn = 0, ps = 0, pn = 0;
  for(let d=a.got; d<=TODAY; d++){ const r = S.reads[d]; if(r){ rs += r[0]; rn += r[1]; } const q = S.paceLog[d]; if(q){ ps += q[0]; pn += q[1]; } }

  return `Kết quả bài tập: ${a.t}\n${S.name}${S.cls ? " · Lớp " + S.cls : ""} · gửi ngày ${dmy(TODAY)}\nHạn nộp: ${dmy(a.due)} · ${onTime}\nĐã làm ${p}/${a.it.length} việc:\n` +
    a.it.map((x,i)=>{ const d = itemDone(a,i); return `${d ? "✅" : "⭕"} ${x[1]}${d ? " (xong " + dmy(d) + ")" : " (chưa làm)"}`; }).join("\n") +
    (rn ? `\nĐọc to: ${rn} câu, đúng trung bình ${Math.round(rs/rn)}%` : "") + (pn ? `\nTốc độ nói trung bình: ${Math.round(ps/pn)} từ/phút` : "") +

}

function showHelp(type, force){
  if(!force && S.help[type]) return;
  const h = HELP[type];
  showPop(`<div class="pw">${h[0]}</div><div class="demo demo-${type}">${h[2]}</div><p>${esc(h[1])}</p><button class="btn" id="helpok">Em hiểu rồi</button>`);
  $("helpok").onclick = ()=>{ S.help[type] = 1; save(); hidePop(); };
}
function helpBtn(type){ return `<button class="btn ghost" data-help="${type}" style="align-self:flex-start;min-height:38px;padding:6px 12px">❓ Cách làm</button>`; }
function bindHelp(){ app.querySelectorAll("[data-help]").forEach(b=>b.onclick = ()=>showHelp(b.dataset.help, true)); }
function unitArg(arg){ const m = /^(\d+)-(\d+)$/.exec(arg||""); return m && unitOf(m[1], m[2]) ? [m[1], +m[2]] : null; }
function practiceUnits(arg){
  const one = unitArg(arg); if(one) return [one];
  const L = learnedUnits().filter(([g,u])=>unitOf(g,u));
  return L.length ? L.slice(-4) : [[srcGrade(), BAI[srcGrade()][0].u]];
}
function poolWords(units){
  const out = [];
  for(const [g,u] of units){ const U = unitOf(g,u); if(!U) continue;
    U.words.forEach((w,i)=>out.push({key:`${g}-${u}-${i}`, w:w[0], vi:w[2], ex:w[3], exvi:w[4], g, u, name:U.name})); }
  return out;
}
function seedMissed(keys){ keys.forEach(k=>{ if(!S.srs[k] || S.srs[k][1] > TODAY) S.srs[k] = [1, TODAY]; }); save(); }
function unitLabel(units){ return units.length === 1 ? `Lớp ${units[0][0]} · Unit ${units[0][1]} · ${unitOf(units[0][0], units[0][1]).name}` : "Các bài em đang học"; }

/* ---------- Nối cặp từ và nghĩa ---------- */
let mc = null;
VIEWS["noi-cap"] = (arg)=>{
  const units = practiceUnits(arg);
  const seenW = new Set(), seenV = new Set();
  const pick5 = shuffle(poolWords(units)).filter(x=>{ const a = x.w.toLowerCase(), b = x.vi.toLowerCase(); if(seenW.has(a) || seenV.has(b)) return false; seenW.add(a); seenV.add(b); return true; }).slice(0,5);
  mc = {arg, units, list: pick5, sel: null, done: 0, miss: 0, wrong: new Set(), t0: Date.now()};
  app.innerHTML = header("Nối cặp", esc(unitLabel(units))) + `
    ${helpBtn("noicap")}
    <section class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="top"><span class="counter" id="mcc">0/${pick5.length} cặp</span><span class="small muted">Chạm từ tiếng Anh, rồi chạm nghĩa</span></div>
      <div class="pairs"><div class="col">${shuffle(pick5.map((x,i)=>[x,i])).map(([x,i])=>`<button class="pbtn" data-l="${i}">${esc(x.w)}</button>`).join("")}</div>
        <div class="col">${shuffle(pick5.map((x,i)=>[x,i])).map(([x,i])=>`<button class="pbtn" data-r="${i}">${esc(x.vi)}</button>`).join("")}</div></div>
      <div id="mcend"></div></section>`;
  bindGrade(); bindHelp();
  const L = [...app.querySelectorAll("[data-l]")], R = [...app.querySelectorAll("[data-r]")];
  L.forEach(b=>b.onclick = ()=>{ if(b.classList.contains("done")) return; L.forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); mc.sel = +b.dataset.l; say(mc.list[mc.sel].w); });
  R.forEach(b=>b.onclick = ()=>{
    if(b.classList.contains("done")) return;
    if(mc.sel == null){ $("mcc").textContent = "Chạm từ tiếng Anh ở cột trái trước nhé"; return; }
    const lb = L.find(x=>+x.dataset.l === mc.sel);
    if(+b.dataset.r === mc.sel){
      [lb, b].forEach(x=>{ x.classList.remove("sel"); x.classList.add("done"); x.disabled = true; });
      mc.done++; if(!mc.wrong.has(mc.sel)){ logOf(TODAY).q++; save(); } mc.sel = null;
      $("mcc").textContent = `${mc.done}/${mc.list.length} cặp`;
      if(mc.done === mc.list.length) mcEnd();
    }else{
      mc.miss++; mc.wrong.add(mc.sel); tone3("bad");
      [lb, b].forEach(x=>{ x.classList.remove("bad"); void x.offsetWidth; x.classList.add("bad"); setTimeout(()=>x.classList.remove("bad"), 600); });
    }
  });
  showHelp("noicap");
};
function mcEnd(){
  const sec = Math.round((Date.now() - mc.t0)/1000), lv = mc.miss === 0 ? ["ok","🟢 Tốt"] : mc.miss <= 2 ? ["near","🟡 Gần đúng"] : ["bad","🟠 Cần luyện"];
  const wrongKeys = [...mc.wrong].map(i=>mc.list[i].key); seedMissed(wrongKeys);
  const one = unitArg(mc.arg); if(one) markDone("noicap", one.join("-"));
  tone3(lv[0]);
  $("mcend").innerHTML = `<div class="onebox"><b>Xong 5 cặp trong ${sec} giây <span class="lv ${lv[0]}">${lv[1]}</span></b>
    <span>${mc.miss ? `Em nối nhầm ${mc.miss} lần. Các từ nhầm đã được đưa vào Sổ từ để ôn hôm nay: ${[...mc.wrong].map(i=>`<b>${esc(mc.list[i].w)}</b>`).join(", ")}.` : "Em nối đúng hết ngay lần đầu. Giỏi lắm!"}</span></div>

  $("mcag").onclick = ()=>VIEWS["noi-cap"](mc.arg);
  tanSay(mc.miss ? "Xong rồi! Em ôn lại các từ nối nhầm trong Sổ từ nhé." : "Tuyệt vời! Em nối đúng hết.", mc.miss ? "" : "Excellent!", !mc.miss);
  celebrate(checkBadges());
}

/* ---------- Tìm từ khác loại (khác chủ đề) ---------- */
let ko = null;
function makeOdd(units, n){
  const out = [];
  for(let tries=0; out.length < n && tries < 60; tries++){
    const [g,u] = pick(units), A = unitOf(g,u), others = BAI[g].filter(x=>x.u !== u);
    if(!A || !others.length) continue;
    const B = pick(others);
    const aw = shuffle(A.words.map((w,i)=>({key:`${g}-${u}-${i}`, w:w[0], vi:w[2]}))).slice(0,3);
    const aSet = new Set(A.words.map(w=>w[0].toLowerCase()));
    const bc = shuffle(B.words.map((w,i)=>({key:`${g}-${B.u}-${i}`, w:w[0], vi:w[2]}))).find(x=>!aSet.has(x.w.toLowerCase()) && !aw.some(y=>y.vi === x.vi));
    if(!bc || out.some(q=>q.odd.w === bc.w)) continue;
    out.push({g, A, B, three: aw, odd: bc, opts: shuffle(aw.concat([bc]))});
  }
  return out;
}
VIEWS["khac-loai"] = (arg)=>{
  const units = practiceUnits(arg);
  ko = {arg, list: makeOdd(units, 5), i: 0, right: 0, miss: []};
  app.innerHTML = header("Tìm từ khác loại", esc(unitLabel(units))) + `${helpBtn("khacloai")}<div class="card" id="kobox" style="display:flex;flex-direction:column;gap:14px"></div>`;
  bindGrade(); bindHelp(); koDraw(); showHelp("khacloai");
};
function koDraw(){
  const box = $("kobox"); if(!box) return;

  box.querySelectorAll(".opt").forEach(b=>b.onclick = ()=>{

/* ---------- Nói điền chỗ trống ---------- */
let dn = null;
function blankQs(units, n){
  const out = [];
  for(const x of shuffle(poolWords(units))){
    if(!x.ex) continue;
    const re = new RegExp("\\b" + x.w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "(s|es|ed|d|ing)?\\b", "i"), m = x.ex.match(re);
    if(!m) continue;
    out.push({...x, target: m[0], before: x.ex.slice(0, m.index), after: x.ex.slice(m.index + m[0].length)});
    if(out.length >= n) break;
  }
  return out;
}
function blankJudge(target, text){
  const tt = normToks(target), s = normToks(text);
  for(let i=0;i+tt.length<=s.length;i++) if(tt.every((w,k)=>s[i+k] === w)) return {lv:"ok"};
  let sum = 0, worst = null;
  for(const w of tt){ let m = 0, mw = ""; for(const x of s){ const v = simWord(w, x); if(v > m){ m = v; mw = x; } } sum += m; if(!worst || m < worst.m) worst = {w, m, heard: mw}; }
  if(tt.length && sum/tt.length >= 0.6) return {lv:"near", heard: worst.heard, w: worst.w};
  return {lv:"bad"};
}
VIEWS["dien-noi"] = (arg)=>{
  const units = practiceUnits(arg);
  dn = {arg, list: blankQs(units, 5), i: 0, right: 0, near: 0, tries: 0, miss: []};
  paReady();
  app.innerHTML = header("Nói điền chỗ trống", esc(unitLabel(units))) + `${helpBtn("diennoi")}<div class="card" id="dnbox" style="display:flex;flex-direction:column;gap:12px"></div>
    ${SR ? "" : `<p class="note">${esc(srError("nosr"))} Em gõ từ còn thiếu vào ô bên dưới.</p>`}`;
  bindGrade(); bindHelp(); dnDraw(); showHelp("diennoi");
};
function dnDraw(){

  if(!dn.list.length){ box.innerHTML = `<p>Chưa có câu phù hợp. Em chọn bài khác nhé.</p>`; return; }

    const pct = Math.round(100*(dn.right + 0.5*dn.near)/dn.list.length), lv = level3(pct); tone3(lv[0]);
    seedMissed(dn.miss); const one = unitArg(dn.arg); if(one) markDone("diennoi", one.join("-"));
    box.innerHTML = `<div class="flash" style="min-height:0"><div style="font-size:48px">${lv[0] === "ok" ? "🌟" : "👍"}</div><h2>Đúng ${dn.right}, gần đúng ${dn.near} trên ${dn.list.length} câu</h2><span class="lv ${lv[0]}">${lv[1]}</span></div>
      <div class="row" style="justify-content:center"><button class="btn green" id="dnag">Làm 5 câu khác</button><a class="btn ghost" href="#hom-nay">Về Hôm nay</a></div>`;
    $("dnag").onclick = ()=>VIEWS["dien-noi"](dn.arg); celebrate(checkBadges()); return;
  }
  const q = dn.list[dn.i]; dn.tries = 0;
  box.innerHTML = `<div class="top"><span class="counter">Câu ${dn.i+1}/${dn.list.length}</span><span class="small muted">Lớp ${q.g} · Unit ${q.u}</span></div>
    <p class="muted">${esc(q.exvi)}</p>
    <p class="q" id="dnq">${esc(q.before)}<span class="blank" id="dnb">?</span>${esc(q.after)}</p>
    <div class="hintrow"><span class="lv near">💡 Nghĩa: ${esc(q.vi)}</span><button class="btn ghost" id="dnh" style="min-height:34px;padding:4px 10px">🔤 Chữ đầu</button></div>
    <button class="btn big green" id="dnmic">🎤 Bấm rồi nói cả câu</button>
    <div class="row"><input type="text" id="dnin" placeholder="Hoặc gõ từ còn thiếu…" style="flex:1;min-width:0" autocomplete="off" autocapitalize="off" enterkeyhint="send"><button class="btn" id="dnsend">Gửi</button></div>
    <p class="small" id="dnheard"></p><div id="dnfb"></div>`;
  $("dnh").onclick = ()=>{ $("dnb").textContent = q.target[0] + " _".repeat(Math.max(0, q.target.length-1)); };
  $("dnsend").onclick = ()=>{ const v = $("dnin").value.trim(); if(v){ $("dnin").value = ""; dnJudge(v, true); } };
  $("dnin").onkeydown = e=>{ if(e.key === "Enter") $("dnsend").click(); };
  $("dnmic").onclick = ()=>{
    if(reading){ try{ reading.stop(); }catch(e){} return; }
    stopSpeak(); const btn = $("dnmic");
    btn.innerHTML = '<span class="rec-dot"></span> Tân đang nghe… (bấm để dừng)';
    reading = listen(tx=>{ $("dnheard").textContent = "Tân nghe được: " + tx; }, (err, tx)=>{
      reading = null; if($("dnmic")) $("dnmic").innerHTML = "🎤 Bấm rồi nói cả câu";
      if(err && !tx){ $("dnheard").textContent = srError(err) + " Em có thể gõ từ còn thiếu vào ô bên dưới."; return; }
      if(tx) dnJudge(tx, false);
    });
    if(!reading) btn.innerHTML = "🎤 Bấm rồi nói cả câu";

function dnJudge(text, typed){
  const q = dn.list[dn.i], r = blankJudge(q.target, text); dn.tries++;
  if(!typed) $("dnheard").textContent = "Tân nghe được: " + text;
  const b = $("dnb"); b.className = "blank " + r.lv; b.textContent = q.target;
  tone3(r.lv);
  const first = dn.tries === 1;
  if(first){ if(r.lv === "ok"){ dn.right++; logOf(TODAY).q++; save(); } else if(r.lv === "near") dn.near++; else dn.miss.push(q.key); }
  const next = `<button class="btn" id="dnn" style="margin-top:10px">${dn.i < dn.list.length-1 ? "Câu tiếp ›" : "Xem kết quả ›"}</button>`;
  const again = `<button class="btn ghost" id="dnag1" style="margin-top:10px">Nói lại</button>`;
  if(r.lv === "ok"){
    $("dnfb").innerHTML = `<p class="why"><span class="lv ok">🟢 Tốt</span> Đúng rồi! Câu đầy đủ: <b>${esc(q.ex)}</b></p>${next}`;
    say(q.ex, {rate:0.85});
  }else if(r.lv === "near"){
    $("dnfb").innerHTML = `<p class="why"><span class="lv near">🟡 Gần đúng</span> Tân nghe thành “${esc(r.heard)}”, từ cần nói là <b>${esc(q.target)}</b>. Em đọc lại từ này cho rõ nhé.</p><div id="dntip"></div><div class="row">${again}${next}</div>`;
    paReady().then(()=>{ const el = $("dntip"); if(el){ el.innerHTML = paTipHTML(q.w.toLowerCase()); bindSlow(el); } });
    say(q.target, {rate:0.6});
  }else{
    $("dnfb").innerHTML = `<p class="why" style="background:var(--bad-soft)"><span class="lv bad">🟠 Cần luyện</span> Từ còn thiếu là <b>${esc(q.target)}</b> (${esc(q.vi)}). Câu đầy đủ: <b>${esc(q.ex)}</b></p><div class="row">${again}${next}</div>`;
    say(q.ex, {rate:0.75});
  }
  $("dnn").onclick = ()=>{ dn.i++; dnDraw(); };
  if($("dnag1")) $("dnag1").onclick = ()=>{ $("dnb").className = "blank"; $("dnb").textContent = "?"; $("dnfb").innerHTML = ""; $("dnheard").textContent = ""; };
}

/* ================= Nói 1 phút (lớp 10-12) ================= */
const LINKERS = ["and","but","because","so","or","also","then","first","firstly","second","secondly","next","finally","however","moreover","besides","although","when","if","for example","for instance","such as","in my opinion","i think","i believe","in addition","on the other hand","in conclusion","that's why","as a result"];
let n1 = null;
function topicOf(g, u){
  const U = unitOf(g,u), t = (window.NOI_1_PHUT||{})[g + "-" + u];
  if(t) return {en: t[0], vi: t[1], qs: t[2]};
  return {en: `Talk about ${U.name}.`, vi: `Nói về chủ đề: ${U.vi}.`, qs: ["What do you know about this topic?", "What do you like or not like about it? Why?", "How is it important in your life?"]};
}

  const u = one ? one[1] : curU.u, U = unitOf(g,u), T = topicOf(g,u);
  const prev = (S.talk1||[]).filter(x=>x.g === g && x.u === u).slice(-1)[0];

  n1 = {g, u, U, T, arg};

    ${+g < 10 ? `<p class="note">Phần này soạn cho lớp 10 đến 12. Em lớp ${g} vẫn thử được, cố gắng nói 30 giây trước nhé.</p>` : ""}
    ${helpBtn("noi1")}
    <div class="row"><select id="n1u" aria-label="Chọn bài" style="flex:1;min-width:0">${BAI[g].map(x=>`<option value="${x.u}"${x.u===u?" selected":""}>Unit ${x.u} · ${esc(x.name)}</option>`).join("")}</select></div>

      <ol>${T.qs.map((q,i)=>`<li><button class="w" data-q="${i}" style="text-align:left">${esc(q)}</button></li>`).join("")}</ol>
      <p class="small" style="margin-top:6px"><b>Từ chủ đề nên dùng:</b> ${U.words.map(w=>`<span class="lv near" style="margin:2px 2px 0 0">${esc(w[0])}</span>`).join(" ")}</p>
      <p class="small"><b>Từ nối:</b> first, then, because, so, but, for example, in my opinion, finally</p></section>
    <section class="card" style="display:flex;flex-direction:column;gap:12px;align-items:stretch">
      <div class="clock" id="n1clock">1:00</div>
      <button class="btn big green" id="n1go">🎤 Bắt đầu nói 1 phút</button>
      <div class="tr" id="n1tr"><span class="muted">Lời em nói sẽ hiện ở đây.</span></div>
      ${SR ? "" : `<p class="note">${esc(srError("nosr"))} Em có thể gõ bài nói vào ô dưới rồi bấm Chấm.</p><textarea id="n1type" placeholder="Gõ bài nói của em…"></textarea><button class="btn" id="n1chk">Chấm bài gõ</button>`}
      ${prev ? `<p class="small muted">Lần trước (${dmy(prev.d)}): ${prev.words} từ${prev.wpm ? `, ${prev.wpm} từ/phút` : ""}, ${prev.link} từ nối.</p>` : ""}
