<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5C45">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.homebar{display:flex;max-width:560px;margin:0 auto;padding-block:10px}
.homebar a{font:600 14px "Be Vietnam Pro",system-ui,sans-serif;color:inherit;text-decoration:none;padding:8px 12px;border-radius:10px;border:1px solid rgba(127,127,127,.35)}</style>
<title>Lớp 7 · Trò chuyện cùng Tân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=Patrick+Hand&display=swap">
<style>
/* Layout: one phone-width column; an illustrated classroom stage (chalkboard + character + teacher's desk), speech bubble under it, chat log, answer choices below. */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --ink:#1C2B27; --muted:#5A6A65; --line:#D5DFDA;
  --sun:#F2B632; --sun-soft:#FCEFC9;
  --ok:#2A8553; --ok-soft:#DDF1E5; --bad:#B9443A; --bad-soft:#F8E1DE;
  --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --chalk:"Patrick Hand","Be Vietnam Pro",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101715; --surface:#19231F; --ink:#E5EDE9; --muted:#9AAAA4; --line:#2B3934;
  --sun:#F5C350; --sun-soft:#3A3220;
  --ok:#5DC48A; --ok-soft:#183427; --bad:#EE7D70; --bad-soft:#3A1E1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101715; --surface:#19231F; --ink:#E5EDE9; --muted:#9AAAA4; --line:#2B3934;
  --sun:#F5C350; --sun-soft:#3A3220;
  --ok:#5DC48A; --ok-soft:#183427; --bad:#EE7D70; --bad-soft:#3A1E1B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);padding-inline:16px;padding-block:16px 32px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font:700 28px/1.1 var(--display);margin:2px 0 0;text-wrap:balance}
.scenes{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 14px var(--body);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--sun);background:var(--sun-soft)}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible,input:focus-visible,.mini:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* classroom stage: a fixed illustration, same colors in both themes */
.stage{border-radius:16px;overflow:hidden;background:#E8DFC8;line-height:0;position:relative}
.stage svg{width:100%;height:auto;display:block}
.tag{position:absolute;left:10px;bottom:10px;line-height:1.2;background:rgba(255,255,255,.88);color:#1C2B27;border-radius:10px;padding:4px 10px;font-size:12px}
.tag b{font:700 15px var(--display);display:block}
.bubble{background:var(--surface);border:1.5px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:16px;min-height:56px;position:relative}
.bubble.talking{border-color:var(--sun)}
.bubble .vi{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.bubble .w{transition:background .1s;border-radius:4px}
.bubble .w.now{background:var(--sun-soft);box-shadow:0 0 0 2px var(--sun-soft)}

/* chalkboard */
.board-t{font-family:var(--chalk);fill:#F2EFE4}
.board-in{animation:chalk .6s ease-out both}
@keyframes chalk{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* character parts */
.head,.arm-l,.arm-r,.body{transform-box:fill-box;transition:transform .35s ease}
.head{transform-origin:50% 92%}
.arm-l{transform-origin:85% 8%;transform:rotate(6deg)}
.arm-r{transform-origin:15% 8%;transform:rotate(-6deg)}
.body{transform-origin:50% 100%}
.blink{animation:blink 4.2s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.breathe{animation:breathe 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe{50%{transform:translateY(1.5px)}}
.m-open,.m-o{display:none}
.char.mopen .m-smile{display:none}.char.mopen .m-open{display:inline}
.char.confused .m-smile,.char.confused .m-open{display:none}.char.confused .m-o{display:inline}
.char.confused .brows{transform:translateY(-4px)}
.char.confused .head{transform:rotate(-9deg)}
.char.happy .cheeks{opacity:.6}
.brows{transition:transform .2s}.cheeks{opacity:.25;transition:opacity .3s}

.char.speaking .head{animation:talkhead .9s ease-in-out infinite}
@keyframes talkhead{0%,100%{transform:rotate(0)}30%{transform:rotate(2.5deg)}70%{transform:rotate(-2deg)}}
.char.act-wave .arm-r{animation:wave .45s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-150deg)}to{transform:rotate(-115deg)}}
.char.act-point .arm-l{transform:rotate(122deg)}
.char.act-point .head{animation:none;transform:rotate(-7deg)}
.char.act-open .arm-l{transform:rotate(38deg)}
.char.act-open .arm-r{transform:rotate(-38deg)}
.char.act-go .arm-r{transform:rotate(-78deg)}
.char.act-nod .head{animation:nod .5s ease-in-out 2}
@keyframes nod{50%{transform:translateY(3px) rotate(2deg)}}
.char.act-nod .arm-r{transform:rotate(-120deg)}
@media (prefers-reduced-motion:reduce){.blink,.breathe,.char.speaking .head,.char.act-wave .arm-r,.char.act-nod .head{animation:none}}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.mini{font:600 13px var(--body);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer}

.log{display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;font-size:15px;min-width:0}
.msg .vi{display:block;font-size:12.5px;color:var(--muted)}
.msg.them{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--sun-soft);align-self:flex-end;border-bottom-right-radius:4px}
.hide-vi .vi{display:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{font:700 17px var(--display);margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:500 15px/1.4 var(--body);text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;cursor:pointer}
.opt:hover{border-color:var(--sun)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75}
.feedback{font-size:14px;border-radius:10px;padding:9px 11px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.btn{font:600 15px var(--body);border:0;background:var(--sun);color:#2A2210;border-radius:12px;padding:11px 16px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{font-size:14px;color:var(--muted)}
input[type=text]{font:500 16px var(--body);padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);flex:1;min-width:0}
.stars{font:700 32px var(--display);color:var(--sun);letter-spacing:4px}
.note{font-size:12.5px;color:var(--muted)}
.progress{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{margin:0;font-size:14px;color:var(--muted)}
.microw{display:flex;align-items:center;gap:12px}
.mic{width:60px;height:60px;flex:none;border-radius:50%;border:0;background:var(--sun);color:#2A2210;cursor:pointer;display:grid;place-items:center}
.mic:disabled{opacity:.4;cursor:default}
.mic.on{background:var(--bad);color:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px var(--bad-soft)}}
.mic:focus-visible,.link:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.micstate{font-size:14px;color:var(--muted);min-width:0}
.said{margin:0;font-size:15px}
.link{align-self:flex-start;background:none;border:0;padding:2px 0;font:500 13.5px var(--body);color:var(--muted);text-decoration:underline;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fixvi{display:block;color:var(--bad)}
.fixen{display:block;margin-top:6px;font-weight:600}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
</style>

</head>
<body>
<nav class="homebar"><a href="index.html">← Trang chủ</a></nav>
<div class="wrap" id="app">
  <header>
    <div class="eyebrow">Lớp 7 · Unit 12 · English-speaking Countries · Bài tập tình huống</div>
    <h1 id="title">Trò chuyện cùng Tân</h1>
  </header>

  <div class="scenes" role="group" aria-label="Chọn tình huống">
    <button class="chip" id="sc0" aria-pressed="true"></button>
    <button class="chip" id="sc1" aria-pressed="false"></button>
  </div>

  <section class="stage" id="stage" aria-label="Lớp học"></section>
  <div class="bubble" id="bubble" aria-live="polite"></div>

  <div class="toolbar">
    <label class="toggle"><input type="checkbox" id="vi" checked> Hiện nghĩa tiếng Việt</label>
    <button class="mini" id="again">🔊 Nghe lại</button>
  </div>

  <div class="log" id="log"></div>

  <section class="panel" id="panel"></section>
  <p class="note" id="voiceNote"></p>
</div>

<script>
/* board: what the chalkboard shows while the line is spoken; "map" draws the way to the library.
   act: the character's gesture (wave, point at board, open hands, go, nod).
   hint: what the student should say, in Vietnamese. say: model answers ({name} matches any name).
   okRe: other answers that are also right. errors: common mistakes with their explanation and fix. */
/* adds -ing to a base verb, used when fixing "like play" → "like playing" */
const ing = v=>({swim:"swimming",run:"running",ride:"riding",make:"making",dance:"dancing",hang:"hanging",surf:"surfing"})[v] || (v.endsWith("e") && v!=="see" ? v.slice(0,-1)+"ing" : v+"ing");
const SCENES = [
  { title:"Nước em muốn đến", chip:"Nói chuyện với Tân", name:"Tân", role:"Bạn cùng lớp 7A", look:"boy",
    intro:"Trên tường thư viện có tấm bản đồ thế giới mới. Tân hỏi em muốn đến nước nói tiếng Anh nào.",
    introBoard:["Unit 12","English-speaking"],
    end:{en:"Me too! Let's save money and go there together, {name}.", vi:"Mình cũng vậy! Mình cùng để dành tiền rồi đi nhé, {name}.", act:"wave", board:["Australia"]},
    turns:[
      {en:"{name}, which English-speaking country do you want to visit?", vi:"{name}, bạn muốn đến nước nói tiếng Anh nào?", act:"wave", board:["Which country?"],
        hint:"Nói em muốn đến Úc (I want to visit Australia).",
        say:["I want to visit Australia.", "I'd like to visit Australia.", "Australia."],
        okRe:/^(i (really )?(want|would like|would love|hope)|id like|id love) to (visit|go|travel)\b|^(australia|canada|england|scotland|wales|ireland|new zealand|the uk|the usa|singapore)\b/,
        errors:[
          {re:/^i (really )?want (visit|go|travel)\b/, vi:"want to + động từ: I want to visit…", fx:s=>s.replace(/\bwant (visit|go|travel)\b/,"want to $1")},
          {re:/^i (really )?want (visiting|going|travelling)\b/, vi:"Sau “want” dùng “to + động từ nguyên mẫu”.", fx:s=>s.replace(/\bwant (visit|go|travell)ing\b/,"want to $1").replace(/\bto travell\b/,"to travel")},
          {re:/\bthe (australia|canada|england|scotland|singapore|new zealand|ireland|america|viet nam|vietnam)\b/, vi:"Tên hầu hết các nước không có “the”: Australia, Canada. Chỉ nói the UK, the USA.", fx:s=>s.replace(/\bthe (australia|canada|england|scotland|singapore|new zealand|ireland|america|viet nam|vietnam)\b/,"$1")},
          {re:/\b(visit|to|in) (uk|usa|united kingdom|united states)\b/, vi:"Nói “the UK”, “the USA” (có “the”).", fx:s=>s.replace(/\b(visit|to|in) (uk|usa|united kingdom|united states)\b/,"$1 the $2")},
          {re:/\bgo (australia|canada|england|scotland|singapore|new zealand|ireland)\b/, vi:"go to + nơi chốn: go to Australia.", fx:s=>s.replace(/\bgo (\w+)/,"go to $1")}],
        opts:[
        {en:"I want visit Australia.", vi:"Mình muốn đến Úc.", why:"want to + động từ: want to visit."},
        {en:"I want to visit the Australia.", vi:"Mình muốn đến Úc.", why:"Trước Australia không dùng “the”."},
        {en:"I want to visit Australia.", vi:"Mình muốn đến Úc.", ok:true, tip:"Australia, Canada (không có the); the UK, the USA (có the)."}]},
      {en:"Why? What is it famous for?", vi:"Sao vậy? Nước đó nổi tiếng về cái gì?", act:"open", board:["Famous for?"],
        hint:"Nói Úc nổi tiếng với chuột túi (It's famous for kangaroos).",
        say:["It's famous for kangaroos.", "It's famous for its beaches and kangaroos.", "Kangaroos."],
        okRe:/\bfamous for\b|^(kangaroos|koalas|beaches|the sydney opera house|the opera house|because)\b/,
        errors:[
          {re:/\bfamous (with|about|of|by)\b/, vi:"Nổi tiếng về… là “famous for”.", fx:s=>s.replace(/\bfamous (with|about|of|by)\b/,"famous for")},
          {re:/^(it|australia) famous\b/, vi:"Thiếu “is”: It is famous for…", fx:s=>s.replace(/^(it|australia) famous\b/,"$1 is famous")},
          {re:/\bfor the (kangaroos|koalas|beaches|animals)\b/, vi:"Nói chung về một loài vật thì không dùng “the”: famous for kangaroos.", fx:s=>s.replace(/\bfor the (kangaroos|koalas|beaches|animals)\b/,"for $1")},
          {re:/\bfor (the )?(kangaroo|koala)$/, vi:"Nói chung về loài vật dùng số nhiều: kangaroos.", fx:s=>s.replace(/\bfor (the )?(kangaroo|koala)$/,"for $2s")}],
        opts:[
        {en:"It's famous with kangaroos.", vi:"Nước đó nổi tiếng với chuột túi.", why:"Nổi tiếng về… là “famous for”."},
        {en:"It's famous for the kangaroos.", vi:"Nước đó nổi tiếng với chuột túi.", why:"Nói chung về loài vật không dùng “the”."},
        {en:"It's famous for kangaroos.", vi:"Nước đó nổi tiếng với chuột túi.", ok:true, tip:"famous for + danh từ số nhiều, không có the."}]},
      {en:"What is the capital of Australia?", vi:"Thủ đô của Úc là gì?", act:"point", board:["Capital?"],
        hint:"Nói đó là Canberra (It's Canberra).",
        say:["It's Canberra.", "The capital of Australia is Canberra.", "Canberra."],
        okRe:/\bcanberra\b/,
        errors:[
          {re:/^(it is |the capital (of australia )?is )?(sydney|melbourne)$/, vi:"Sydney và Melbourne là thành phố lớn, nhưng thủ đô của Úc là Canberra.", fx:s=>s.replace(/\b(sydney|melbourne)\b/,"canberra")},
          {re:/^capital of\b/, vi:"Trước “capital of …” cần “the”: The capital of Australia…", fx:s=>s.replace(/^capital of\b/,"the capital of")},
          {re:/\bthe canberra\b/, vi:"Trước tên thành phố không dùng “the”.", fx:s=>s.replace(/\bthe canberra\b/,"canberra")},
          {re:/\bthe australia\b/, vi:"Trước Australia không dùng “the”.", fx:s=>s.replace(/\bthe australia\b/,"australia")}],
        opts:[
        {en:"It's Sydney.", vi:"Là Sydney.", why:"Thủ đô của Úc là Canberra, không phải Sydney."},
        {en:"Capital of Australia is Canberra.", vi:"Thủ đô của Úc là Canberra.", why:"Cần “the”: The capital of Australia…"},
        {en:"It's Canberra.", vi:"Là Canberra.", ok:true, tip:"the capital of + tên nước; tên thành phố không có the."}]},
      {en:"Do people there speak English?", vi:"Người dân ở đó nói tiếng Anh à?", act:"nod", board:["English?"],
        hint:"Nói có, tiếng Anh là ngôn ngữ chính của họ (Yes, they do. English is their main language).",
        say:["Yes, they do. English is their main language.", "Yes, they do.", "Yes, they speak English."],
        okRe:/^(yes|no)\b|^english is\b|^they speak\b/,
        errors:[
          {re:/^yes they (are|is|does)\b/, vi:"Câu hỏi “Do…?” thì đáp “Yes, they do.”", fx:s=>s.replace(/^yes they (are|is|does)\b/,"yes they do")},
          {re:/\bthe english is\b/, vi:"Tên ngôn ngữ không dùng “the”: English is…", fx:s=>s.replace(/\bthe english is\b/,"english is")},
          {re:/\bspeaks? the english\b/, vi:"Tên ngôn ngữ không dùng “the”: speak English.", fx:s=>s.replace(/\b(speaks?) the english\b/,"$1 english")},
          {re:/\bthey speaks\b/, vi:"“They” đi với “speak”, không thêm “s”.", fx:s=>s.replace(/\bthey speaks\b/,"they speak")}],
        opts:[
        {en:"Yes, they are.", vi:"Ừ.", why:"Câu hỏi “Do…?” thì đáp “Yes, they do.”"},
        {en:"Yes, they do. The English is their main language.", vi:"Ừ. Tiếng Anh là ngôn ngữ chính của họ.", why:"Tên ngôn ngữ không có “the”: English is…"},
        {en:"Yes, they do. English is their main language.", vi:"Ừ. Tiếng Anh là ngôn ngữ chính của họ.", ok:true, tip:"English, Vietnamese: không có the."}]}
    ]},
  { title:"Chuyến đi Scotland", chip:"Hỏi chuyện thầy Hùng", name:"Thầy Hùng", role:"Giáo viên tiếng Anh", look:"teacher",
    intro:"Hè vừa rồi thầy Hùng đi tập huấn ở Scotland. Thầy cho lớp xem ảnh và hỏi em vài câu.",
    introBoard:["Scotland","A summer trip"],
    end:{en:"I hope you will visit the UK one day, {name}.", vi:"Thầy mong một ngày em sẽ đến Vương quốc Anh, {name}.", act:"wave", board:["See you there!"]},
    turns:[
      {en:"{name}, I visited Scotland last summer. Do you know its capital?", vi:"{name}, hè vừa rồi thầy đến Scotland. Em có biết thủ đô của nó không?", act:"open", board:["Capital?"],
        hint:"Nói có, đó là Edinburgh (Yes, it's Edinburgh).",
        say:["Yes, it's Edinburgh.", "It's Edinburgh.", "Edinburgh."],
        okRe:/\bedinburgh\b/,
        errors:[
          {re:/\bthe edinburgh\b/, vi:"Trước tên thành phố không dùng “the”.", fx:s=>s.replace(/\bthe edinburgh\b/,"edinburgh")},
          {re:/\blondon\b/, vi:"London là thủ đô của nước Anh và Vương quốc Anh. Thủ đô của Scotland là Edinburgh.", fx:s=>s.replace(/\blondon\b/,"edinburgh")},
          {re:/\bglasgow\b/, vi:"Glasgow là thành phố lớn nhất Scotland, còn thủ đô là Edinburgh.", fx:s=>s.replace(/\bglasgow\b/,"edinburgh")}],
        opts:[
        {en:"Yes, it's London.", vi:"Dạ, là London.", why:"London là thủ đô của Anh; thủ đô của Scotland là Edinburgh."},
        {en:"Yes, it's the Edinburgh.", vi:"Dạ, là Edinburgh.", why:"Trước tên thành phố không dùng “the”."},
        {en:"Yes, it's Edinburgh.", vi:"Dạ, là Edinburgh ạ.", ok:true, tip:"Tên thành phố không có mạo từ: Edinburgh, London."}]},
      {en:"What can tourists see in Edinburgh?", vi:"Du khách có thể xem gì ở Edinburgh?", act:"point", board:["What to see?"],
        hint:"Nói họ có thể xem một lâu đài cổ (They can see an old castle).",
        say:["They can see an old castle.", "They can see a famous castle."],
        okRe:/^(they|tourists|you|we|people) can (see|visit)\b|^(an?|the) \w+/,
        errors:[
          {re:/\ba (old|ancient|interesting|amazing|old|historic|enormous)\b/, vi:"Trước từ bắt đầu bằng nguyên âm (old, ancient) dùng “an”: an old castle.", fx:s=>s.replace(/\ba (old|ancient|interesting|amazing|enormous)\b/,"an $1")},
          {re:/\ban (castle|famous|big|beautiful|museum|church|palace|hill|tall|great|kilt)\b/, vi:"Trước từ bắt đầu bằng phụ âm dùng “a”: a castle.", fx:s=>s.replace(/\ban (castle|famous|big|beautiful|museum|church|palace|hill|tall|great|kilt)\b/,"a $1")},
          {re:/\bcan (sees|saw|seeing|to see)\b/, vi:"Sau “can” dùng động từ nguyên mẫu: can see.", fx:s=>s.replace(/\bcan (sees|saw|seeing|to see)\b/,"can see")},

const synth = window.speechSynthesis;
let voice = null, viVoice = null, flap = null, guard = null, bounds = false, wordTimer = null;
function pickVoice(){
  if(!synth) return;
  const all = synth.getVoices();
  const vs = all.filter(v=>/^en[-_]/i.test(v.lang));
  voice = vs.find(v=>/en[-_](GB|US)/i.test(v.lang) && /google|samantha|daniel|zira|libby|sonia|ryan/i.test(v.name)) || vs[0] || null;
  viVoice = all.find(v=>/^vi/i.test(v.lang)) || null;
}

  ? "Giọng đọc lấy từ điện thoại của em, không tốn phí. Nếu không nghe tiếng, hãy bật âm lượng và tắt chế độ im lặng."
  : "Trình duyệt này chưa đọc được tiếng Anh. Em vẫn đọc câu trong khung thoại để luyện tập.";

const G = ()=>$("charg");
function mouth(open){ const g=G(); if(g) g.classList.toggle("mopen", open); }
function setAct(a){ const g=G(); if(!g) return; g.className.baseVal = g.className.baseVal.replace(/\bact-\w+/g,"").trim(); if(a) g.classList.add("act-"+a); }

  document.querySelectorAll("#bubble .w").forEach((w,k)=>w.classList.toggle("now", k===i));
}
function stopAll(){

}

/* who: "char" moves the character's mouth, head and arms; "me" only reads the student's answer aloud.
   lang "vi": Vietnamese explanation, read with the phone's Vietnamese voice when it has one. */
function speak(text, who, act, done, lang){
  const vi = lang==="vi";
  const words = text.split(/\s+/);
  clearTimeout(guard); clearInterval(flap); clearInterval(wordTimer); bounds = false;
  let finished = false;
  const g = G();
  const finish = ()=>{
    if(finished) return; finished = true;
    clearTimeout(guard); clearInterval(flap); clearInterval(wordTimer);
    if(who==="char"){ mouth(false); g && g.classList.remove("speaking"); $("bubble").classList.remove("talking"); highlight(-1);
      setTimeout(()=>setAct(""), 700); }
    const d = done; done = null; d && d();
  };
  if(who==="char"){
    g && g.classList.add("speaking"); setAct(act); $("bubble").classList.add("talking");
    // steady mouth rhythm until the voice reports word boundaries
    flap = setInterval(()=>{ if(!bounds){ const gg=G(); gg && gg.classList.toggle("mopen"); } }, 150);
    if(!vi){ let wi = 0; highlight(0); wordTimer = setInterval(()=>{ if(!bounds){ wi++; highlight(wi); } }, 380); }
  }
  guard = setTimeout(finish, words.length*(vi?330:480) + 1500);
  if(!synth || (vi && !viVoice)) return;
  try{
    synth.cancel();
    const spoken = vi ? text : text.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D");
    const u = new SpeechSynthesisUtterance(spoken);
    if(vi){ u.voice = viVoice; u.lang = viVoice.lang; u.rate = 1; }
    else { u.lang = voice ? voice.lang : "en-GB"; if(voice) u.voice = voice; u.rate = 0.85; }
    u.pitch = who==="char" ? (S().look==="teacher" ? 0.8 : 1.1) : 1;
    u.onstart = ()=>{ clearTimeout(guard); guard = setTimeout(finish, words.length*900 + 3000); };
    u.onboundary = e=>{
      if(who!=="char" || e.name==="sentence") return;
      bounds = true; clearInterval(flap);
      if(!vi){ const upto = spoken.slice(0, e.charIndex); highlight(upto.trim() ? upto.trim().split(/\s+/).length : 0); }
      mouth(true); setTimeout(()=>mouth(false), 130);
      setTimeout(()=>mouth(true), 200); setTimeout(()=>mouth(false), 290);
    };
    u.onend = finish; u.onerror = finish;
    synth.speak(u);
  }catch(e){}
}

/* ---------- checking what the student said ---------- */
const NUM = {one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",nine:"9",ten:"10",eleven:"11",twelve:"12"};
const SAME = {math:"maths",favorite:"favourite",okay:"ok","o.k.":"ok",mr:"mr",mister:"mr",socialize:"socialise",neighborhood:"neighbourhood",center:"centre",color:"colour",hardworking:"hard-working",counselor:"counsellor",prioritize:"prioritise",realize:"realise",apologize:"apologise",organized:"organised",traveler:"traveller",theater:"theatre",traveling:"travelling",traveled:"travelled",program:"programme",organize:"organise"};
function norm(s){
  let t = s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d")
    .replace(/[’`]/g,"'").replace(/[.,!?;:"“”()]/g," ");
  t = t.replace(/\b(i)'m\b/g,"i am").replace(/\b(you|we|they)'re\b/g,"$1 are")
       .replace(/\b(it|name|that|what|where|he|she|there|who)'s\b/g,"$1 is")
       .replace(/\bdon't\b/g,"do not").replace(/\bdoesn't\b/g,"does not").replace(/\bcan't\b/g,"cannot").replace(/\bwon't\b/g,"will not")
       .replace(/'/g,"");
  let w = t.split(/\s+/).filter(Boolean).map(x=>NUM[x]||SAME[x]||x);
  t = w.join(" ").replace(/\b(\d+) ([a-e])\b/g,"$1$2");
  return t;
}
const toks = s=>s ? s.split(" ") : [];
/* word-level edit distance; "{name}" in the model answer matches any one word */
function align(said, model){
  const a = toks(said), b = toks(model), n = a.length, m = b.length;
  const eq = (x,y)=> y==="{name}" || x===y;
  const d = Array.from({length:n+1},(_,i)=>Array.from({length:m+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (eq(a[i-1],b[j-1])?0:1));
  const ops = []; let i=n, j=m;
  while(i>0 || j>0){
    if(i>0 && j>0 && d[i][j]===d[i-1][j-1] + (eq(a[i-1],b[j-1])?0:1)){
      if(!eq(a[i-1],b[j-1])) ops.unshift({t:"sub", said:a[i-1], want:b[j-1]}); i--; j--; }
    else if(j>0 && d[i][j]===d[i][j-1]+1){ ops.unshift({t:"miss", want:b[j-1]}); j--; }
    else { ops.unshift({t:"extra", said:a[i-1]}); i--; }
  }
  return {dist:d[n][m], score: 1 - d[n][m]/Math.max(n,m,1), ops};
}
const show = w=> w==="{name}" ? name : w==="i" ? "I" : w;
function explain(op){
  if(op.t==="miss"){
    if(op.want==="{name}") return "Em chưa nói tên của mình.";
    if(["am","is","are"].includes(op.want)) return `Em nói thiếu động từ “${op.want}”. Câu tiếng Anh cần có động từ.`;
    return `Em nói thiếu từ “${show(op.want)}”.`;
  }
  if(op.t==="extra") return `Em nói thừa từ “${show(op.said)}”.`;
  if(op.said===op.want+"s") return `Em nói “${op.said}”, phải nói “${op.want}”. Ở câu này động từ không thêm “s”.`;
  return `Em nói “${show(op.said)}”, phải nói “${show(op.want)}”.`;
}
const PROPER = ["english","monday","tuesday","wednesday","thursday","friday","saturday","sunday","mr","vinh thanh","diy","gia lai","quy nhon","lan","minh","nam","mai","hoa","viet nam","vietnam","tet","ha noi","hanoi","ho chi minh city","hue","da nang","pleiku","london","sydney","tokyo","paris","new york","singapore","bangkok","australia","england","uk","usa","mars","jupiter","venus","the moon","canada","america","scotland","new zealand","halong bay","ha long bay","christmas","mid-autumn"];
const FIXUP = [[/\blets\b/g,"let's"],[/\bisnt\b/g,"isn't"],[/\barent\b/g,"aren't"],[/\bdidnt\b/g,"didn't"],[/\bshouldnt\b/g,"shouldn't"],[/\bmustnt\b/g,"mustn't"],[/\bwont\b/g,"won't"],[/\bdoesnt\b/g,"doesn't"],[/\bdont\b/g,"don't"],[/\bcant\b/g,"can't"],[/\bwasnt\b/g,"wasn't"],[/\bwerent\b/g,"weren't"],[/\bhasnt\b/g,"hasn't"],[/\bhavent\b/g,"haven't"],[/\bcouldnt\b/g,"couldn't"],[/\bive\b/g,"I've"],[/\bweve\b/g,"we've"],[/\btheyve\b/g,"they've"],[/\byoull\b/g,"you'll"],[/\bwell\b(?= (be|go|have|need|meet|see|do|visit|plant|clean|make))/g,"we'll"],[/\bid\b/g,"I'd"],[/\bill\b/g,"I'll"],[/\bvinh thanh\b/g,"Vĩnh Thạnh"],[/\bdiy\b/g,"DIY"],[/(\w) however (?=\w)/g,"$1. however, "],[/\b(hello|hi|good morning|good afternoon) sir (?=(where|what|how|can|could|is|may|when|who|i)\b)/g,"$1, sir. "],[/(\w) (but|so) (?=(i|it|we|they|he|she|you|the|my|there)\b)/g,"$1, $2 "]];
const pretty = s=>{ let q;
  const m = s.match(/^(yes|no)( (?:i|it|there|he|she|we|they|you) (?:do|does|am|is|are|can|will|was|were|did|have|has|must|mustnt|must not|cannot|isnt|arent|wasnt|werent|didnt|havent|hasnt|cannot|do not|does not|will not|have not))?(?: (.+))?$/);
  if(m){ const newSentence = m[3] && /^(i|it|we|they|he|she|you|the|my|our|your|there|this|that|please|thank|of|its|his|her|when|what|where|how|who|why|which|lets)\b/.test(m[3]);
    s = m[1] + (m[2] ? ","+m[2] : (m[3] && !newSentence ? "," : "")) + (m[3] ? (newSentence ? ". " : " ") + m[3] : ""); }
  let t = s.replace(/\bi\b/g,"I").replace(/\b(\d+)([a-e])\b/g,(m,d,l)=>d+l.toUpperCase());
  for(const p of PROPER) t = t.replace(new RegExp("\\b"+p+"\\b","g"), w=>w.split(" ").map(x=>x[0].toUpperCase()+x.slice(1)).join(" "));
  t = t.replace(/\b(Uk|Usa)\b/g, w=>w.toUpperCase()).replace(/\bThe Moon\b/g,"the Moon");
  for(const [re,to] of FIXUP) t = t.replace(re,to);
  t = t.replace(/\b(\d+)\b(?![A-E])/g,(m,d)=>Object.keys(NUM).find(k=>NUM[k]===d)||d);
  t = t.replace(/\. ([a-z])/g,(x,c)=>". "+c.toUpperCase());
  q = /^(when|what|where|how|who|why|which|do|does|did|can|could|will|would|is|are|shall)\b/i.test(t.split(/[.!?] /).pop());
  return t[0].toUpperCase()+t.slice(1)+(q?"?":"."); };
/* returns {status: ok | near | wrong | empty, model, notes[]} */
function evaluate(raw, t){
  const said = norm(raw);
  if(!said) return {status:"empty", notes:[]};
  let best = null;
  for(const s of t.say){ const r = align(said, norm(s)); r.model = s; if(!best || r.dist < best.dist) best = r; }
  // every matching mistake is explained and fixed; the fixed sentence is shown as the nearest model answer when it is close to one
  const rules = (t.errors||[]).filter(e=>e.re.test(said));
  if(rules.length){
    let fixed = said; for(const e of rules) if(e.fx) fixed = e.fx(fixed);
    let model = best.model;
    if(rules.some(e=>e.fx)){
      let near = null; for(const s of t.say){ const r = align(fixed, norm(s)); if(!near || r.dist < near.dist){ near = r; near.model = s; } }
      const nm = toks(norm(near.model)), lost = toks(fixed).some(w=>w.length>=4 && !nm.includes(w));
      model = !lost && near.dist <= 2 && near.dist*2 < toks(fixed).length ? near.model : pretty(fixed);
    }
    return {status:"wrong", model, notes: rules.map(e=>e.vi)};
  }
  if(best.dist===0) return {status:"ok", model:best.model, notes:[]};
  if(t.okRe && t.okRe.test(said)) return {status:"ok", model:best.model, notes:[]};
  const notes = best.ops.slice(0,3).map(explain);
  if(best.dist<=1 && best.score>=0.75) return {status:"near", model:best.model, notes};
  if(best.score < 0.4) return {status:"wrong", model:best.model, notes:["Câu em nói chưa đúng ý. " + t.hint]};
  return {status:"wrong", model:best.model, notes};
}

/* ---------- state ---------- */
let sceneIx = 0, turn = 0, misses = 0, firstTry = 0, name = "An", last = null, rec = null, micBlocked = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function S(){ return SCENES[sceneIx]; }
function $(id){ return document.getElementById(id); }
const fill = s=>s.replaceAll("{name}", name);
function esc(s){ return s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
/* Tân is a classmate, so he says "bạn"; the teacher says "em" */
const voc = s=> S().look==="teacher" ? s : s.replace(/\bEm\b/g,"Bạn").replace(/\bem\b/g,"bạn");
const spans = en=> en.split(/\s+/).map(w=>`<span class="w">${esc(w)}</span>`).join(" ");

function sayChar(line){
  last = {line};
  const en = fill(line.en);
  $("bubble").innerHTML = `<b>${esc(S().name)}:</b> ${spans(en)}<span class="vi">${esc(fill(line.vi))}</span>`;
  if(line.board) drawBoard(line.board);
  speak(en, "char", line.act);
}
/* correction: Vietnamese explanation first, then the English sentence to say */
function sayFix(viText, en, done){
  viText = voc(viText);
  last = {fix:[viText, en]};
  $("bubble").innerHTML = `<b>${esc(S().name)}:</b> <span class="fixvi">${esc(viText)}</span>
    <span class="fixen">Say: ${spans(en)}</span>`;
  speak(viText, "char", "open", ()=>{
    setTimeout(()=>speak("Say: " + en, "char", "point", done), 250);
  }, "vi");
}
function addMsg(text, vi, me){
  const d = document.createElement("div"); d.className = "msg " + (me ? "me" : "them");
  d.innerHTML = `${esc(text)}${vi ? `<span class="vi">${esc(vi)}</span>` : ""}`;
  $("log").appendChild(d);
}

function loadScene(i){
  sceneIx = i; turn = 0; misses = 0; firstTry = 0; last = null;
  stopAll(); stopRec();
  [0,1].forEach(k=>$("sc"+k).setAttribute("aria-pressed", k===i));
  $("title").textContent = S().title;
  $("stage").innerHTML = classroomSVG(S().look) + `<div class="tag"><b>${esc(S().name)}</b>${esc(S().role)}</div>`;
  drawBoard(S().introBoard);
  $("log").innerHTML = "";
  $("bubble").textContent = S().intro;
  $("panel").innerHTML = `<h2>Trước khi bắt đầu</h2>
    <div class="row"><label for="nm">Tên của em (bằng tiếng Anh, không dấu cũng được)</label></div>
    <div class="row"><input type="text" id="nm" value="${esc(name)}" maxlength="20" autocomplete="off"><button class="btn" id="go">Bắt đầu nói chuyện</button></div>
    <p class="note">Nhân vật nói tiếng Anh. Em bấm nút micro và nói câu trả lời bằng tiếng Anh. Nếu em nói sai, nhân vật chỉ ra chỗ sai bằng tiếng Việt và đọc câu đúng bằng tiếng Anh để em nói lại.</p>`;
  $("go").onclick = ()=>{ name = ($("nm").value.trim() || "An").slice(0,20); setExpr(""); showTurn(); };
}

function showTurn(){
  const t = S().turns[turn]; misses = 0;
  addMsg(fill(t.en), fill(t.vi), false); sayChar(t);
  const micUI = SR && !micBlocked
    ? `<button class="mic" id="mic" aria-label="Bấm để nói"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12h-2Z"/></svg></button>
       <div class="micstate" id="micstate">Bấm nút và nói câu trả lời bằng tiếng Anh</div>`
    : `<div class="micstate">${SR ? "Trang thử này chưa được dùng micro." : "Trình duyệt này chưa nghe được giọng nói."} Em gõ câu em muốn nói vào ô bên dưới.</div>`;
  $("panel").innerHTML = `<div class="row" style="justify-content:space-between"><h2>Em hãy nói</h2><span class="progress">Câu ${turn+1}/${S().turns.length}</span></div>
    <p class="hint"><b>Gợi ý:</b> ${esc(t.hint)}</p>
    <div class="microw">${micUI}</div>
    <div id="heard"></div>
    <div class="row"><label for="typed" class="sr">Câu em nói</label><input type="text" id="typed" placeholder="Hoặc gõ câu em nói…" autocomplete="off" enterkeyhint="send"><button class="mini" id="send">Gửi</button></div>
    <div id="fb"></div>
    <button class="link" id="pick">Khó quá? Chọn câu có sẵn</button>`;
  if($("mic")) $("mic").onclick = listen;
  $("send").onclick = ()=>{ const v = $("typed").value.trim(); if(v){ $("typed").value = ""; judge(v); } };
  $("typed").onkeydown = e=>{ if(e.key==="Enter") $("send").click(); };
  $("pick").onclick = showOptions;
}

/* ---------- microphone (the phone's own speech recognition, free) ---------- */
function stopRec(){ if(rec){ try{ rec.abort(); }catch(e){} rec = null; } }
function listen(){
  if(rec){ stopRec(); setMic(false, "Bấm nút và nói câu trả lời bằng tiếng Anh"); return; }
  stopAll(); mouth(false);
  const r = new SR(); rec = r;
  r.lang = "en-US"; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
  let finalAlts = null, gotAny = false;
  r.onresult = e=>{
    const res = e.results[e.results.length-1];
    gotAny = true;
    $("heard").innerHTML = `<p class="said">Em nói: “${esc(res[0].transcript)}”</p>`;
    if(res.isFinal) finalAlts = Array.from(res).map(a=>a.transcript);
  };
  r.onerror = e=>{
    if(e.error==="not-allowed" || e.error==="service-not-allowed" || e.error==="audio-capture"){
      micBlocked = true;
      $("micstate").textContent = "Không mở được micro. Em gõ câu em muốn nói vào ô bên dưới. Trong ứng dụng thật, em cho phép dùng micro là nói được.";
      $("mic").disabled = true;
    }
  };
  r.onend = ()=>{
    if(rec!==r) return;
    rec = null; setMic(false, "Bấm nút và nói câu trả lời bằng tiếng Anh");
    if(micBlocked) return;
    if(finalAlts && finalAlts.length){
      // the recogniser offers several guesses; keep the one closest to a right answer
      const t = S().turns[turn], rank = {ok:0, near:1, wrong:2, empty:3};
      let pick = finalAlts[0], bestR = evaluate(pick, t);
      for(const alt of finalAlts.slice(1)){ const r2 = evaluate(alt, t); if(rank[r2.status] < rank[bestR.status]){ pick = alt; bestR = r2; } }
      judge(pick);
    } else if(!gotAny){
      $("fb").innerHTML = `<div class="feedback bad">Mình chưa nghe rõ. Em bấm nút và nói to, rõ hơn nhé.</div>`;
    }
  };
  try{ r.start(); setMic(true, "Đang nghe… em nói đi"); }catch(e){ rec = null; }
}
function setMic(on, msg){
  const b = $("mic"); if(b) b.classList.toggle("on", on);
  const s = $("micstate"); if(s && !micBlocked) s.textContent = msg;
}

function judge(raw){
  const t = S().turns[turn];
  const r = evaluate(raw, t);
  $("heard").innerHTML = `<p class="said">Em nói: “${esc(raw)}”</p>`;
  if(r.status==="empty") return;
  const model = fill(r.model);
  if(r.status==="ok" || r.status==="near"){
    if(misses===0) firstTry++;
    setExpr("happy"); setAct("nod");
    addMsg(raw, "", true);
    const tip = (t.opts.find(o=>o.ok)||{}).tip || "";
    const next = ()=>{ turn++; setTimeout(()=>{ setExpr(""); setAct(""); turn < S().turns.length ? showTurn() : finish(); }, 400); };
    if(r.status==="ok"){
      $("panel").innerHTML = `<div class="feedback ok"><b>Đúng rồi!</b> ${esc(tip)}</div>`;
      speak("Great!", "char", "nod", next);
    }else{
      $("panel").innerHTML = `<div class="feedback ok"><b>Gần đúng rồi!</b> ${esc(voc(r.notes.join(" ")))}<br>Câu đúng: <b>${esc(model)}</b></div>`;
      sayFix("Gần đúng rồi. " + r.notes.join(" "), model, next);
    }
  }else{
    misses++;
    setExpr("confused");
    $("fb").innerHTML = `<div class="feedback bad"><b>Chỗ sai:</b> ${esc(voc(r.notes.join(" ")))}<br><b>Cách sửa:</b> ${voc("em")} nói “${esc(model)}”.</div>`;
    sayFix(r.notes.join(" ") + (S().look==="teacher" ? " Em nói lại theo thầy nhé." : " Em nói lại theo mình nhé."), model, ()=>setExpr(""));
  }
}

function showOptions(){
  const t = S().turns[turn];
  stopRec();
  $("panel").innerHTML = `<div class="row" style="justify-content:space-between"><h2>Chọn câu trả lời</h2><span class="progress">Câu ${turn+1}/${S().turns.length}</span></div>
    <div class="opts">${t.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(fill(o.en))}</button>`).join("")}</div><div id="fb"></div>`;
  $("panel").querySelectorAll(".opt").forEach(b=>b.onclick = ()=>choose(+b.dataset.k, b));
}
function choose(k, btn){
  const o = S().turns[turn].opts[k];
  if(o.ok){
    if(misses===0) firstTry++;
    setExpr("happy"); setAct("nod");
    addMsg(fill(o.en), fill(o.vi), true);
    $("panel").innerHTML = `<div class="feedback ok"><b>Đúng rồi!</b> ${esc(o.tip||"")}</div>`;
    speak(fill(o.en), "me", null, ()=>{
      turn++;
      setTimeout(()=>{ setExpr(""); setAct(""); turn < S().turns.length ? showTurn() : finish(); }, 350);
    });
  }else{
    misses++;
    btn.classList.add("wrong"); btn.disabled = true;
    setExpr("confused");
    $("fb").innerHTML = `<div class="feedback bad"><b>Chưa đúng.</b> ${esc(o.why)} Em thử chọn câu khác nhé.</div>`;
    sayFix(o.why, fill(S().turns[turn].say[0]), ()=>setExpr(""));
  }
}

function finish(){
  const total = S().turns.length;
  const end = S().end; addMsg(fill(end.en), fill(end.vi), false); sayChar(end); setExpr("happy");
  const stars = firstTry===total ? 3 : firstTry >= total-1 ? 2 : 1;
  const next = sceneIx===0 ? `<button class="mini" id="nx">Sang tình huống tiếp: ${esc(SCENES[1].chip)}</button>` : "";
  $("panel").innerHTML = `<h2>Hoàn thành!</h2>
    <div class="stars" aria-label="${stars} sao">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>
    <p>Em trả lời đúng ngay lần đầu <b>${firstTry}/${total}</b> câu.</p>
    <div class="row"><button class="btn" id="rp">Làm lại</button>${next}</div>`;
  $("rp").onclick = ()=>loadScene(sceneIx);
  if(next) $("nx").onclick = ()=>loadScene(1);
}

$("sc0").onclick = ()=>loadScene(0);
$("sc1").onclick = ()=>loadScene(1);
$("again").onclick = ()=>{
  if(!last) return;
  if(last.line) sayChar(last.line); else sayFix(last.fix[0], last.fix[1]);
};
$("vi").onchange = e=>$("app").classList.toggle("hide-vi", !e.target.checked);
SCENES.forEach((sc,k)=>{ $("sc"+k).textContent = sc.chip; });
loadScene(0);
</script>
